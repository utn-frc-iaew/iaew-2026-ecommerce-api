<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Vista del orador · Clase 09</title>
<style>*{box-sizing:border-box}body{margin:0;background:#081826;color:#eaf5fb;font:16px/1.5 Inter,system-ui,sans-serif}header{display:flex;align-items:center;gap:18px;padding:14px 24px;background:#0e293c;border-bottom:1px solid #315069}header strong{color:#67d7e7}header span:nth-child(2){margin-right:auto}.timer{font:700 22px ui-monospace,monospace}button{background:#16374b;color:white;border:1px solid #4c7188;border-radius:7px;padding:8px 13px;cursor:pointer}button:hover{background:#20506b}main{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(420px,1.2fr);gap:20px;padding:20px;height:calc(100vh - 68px)}.panel{background:#102d41;border:1px solid #315069;border-radius:14px;padding:22px;overflow:auto}.preview{display:grid;place-items:center;min-height:280px;background:#f7fafc;color:#10202f;border-radius:12px;padding:28px;text-align:center}.preview .kicker{color:#0084a1;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.preview h1{font-size:38px;line-height:1.1}.next{margin-top:18px;padding:16px;border-left:5px solid #35b779;background:#173a4d}.next small{display:block;color:#abc5d7}.notes h3{margin:1.1rem 0 .25rem;color:#67d7e7}.notes p{margin:.2rem 0 .8rem;font-size:19px}.status{color:#abc5d7;font-size:14px}.controls{display:flex;gap:10px;margin-top:18px}@media(max-width:820px){main{grid-template-columns:1fr;height:auto}.panel{overflow:visible}}</style></head>
<body><header><strong>CLASE 09 · ORADOR</strong><span id="counter">Abrí la presentación principal…</span><span class="timer" id="timer">00:00</span><button id="timerToggle">Iniciar</button><button id="timerReset">Reiniciar</button></header>
<main><section class="panel"><div class="preview"><div><p class="kicker" id="kicker">Esperando presentación</p><h1 id="title">Abrí index.html</h1></div></div><div class="next"><small>SIGUIENTE</small><strong id="nextTitle">—</strong></div><div class="controls"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div><p class="status" id="status">Las notas y navegación se sincronizan con la presentación.</p></section><section class="panel notes" id="notes"><p>Las notas aparecerán al recibir el estado de la presentación.</p></section></main>
<script>
let current=0,total=0,seconds=0,running=false,timerId=null;const bc="BroadcastChannel"in window?new BroadcastChannel("iaew-clase-09-presenter"):null;
function send(message){const payload=Object.assign({source:"presenter",sentAt:Date.now()},message);if(bc)bc.postMessage(payload);try{localStorage.setItem("iaew-clase-09-presenter-message",JSON.stringify(payload))}catch{}}
function receive(p){if(!p||p.source==="presenter"||p.type!=="state")return;current=p.current;total=p.total;document.querySelector("#counter").textContent=`${current+1} / ${total}`;document.querySelector("#kicker").textContent=p.kicker;document.querySelector("#title").textContent=p.title;const notesPanel=document.querySelector("#notes");const heading=document.createElement("h3");heading.textContent="Guion para leer";const paragraphs=String(p.notes||"").split(/\n\n+/).map(text=>{const paragraph=document.createElement("p");paragraph.textContent=text;return paragraph});notesPanel.replaceChildren(heading,...paragraphs);notesPanel.scrollTop=0;document.querySelector("#nextTitle").textContent=p.nextTitle;document.querySelector("#status").textContent=`Sincronizado · ${new Date(p.sentAt).toLocaleTimeString()}`}
if(bc)bc.onmessage=e=>receive(e.data);addEventListener("storage",e=>{if(e.key==="iaew-clase-09-presenter-state"&&e.newValue)receive(JSON.parse(e.newValue))});
document.querySelector("#prev").onclick=()=>send({type:"navigate",index:Math.max(0,current-1)});document.querySelector("#next").onclick=()=>send({type:"navigate",index:Math.min(total-1,current+1)});
function paintTimer(){document.querySelector("#timer").textContent=`${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`}
document.querySelector("#timerToggle").onclick=()=>{running=!running;document.querySelector("#timerToggle").textContent=running?"Pausar":"Continuar";clearInterval(timerId);if(running)timerId=setInterval(()=>{seconds++;paintTimer()},1000)};
document.querySelector("#timerReset").onclick=()=>{seconds=0;paintTimer()};addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.querySelector("#next").click();if(e.key==="ArrowLeft")document.querySelector("#prev").click()});send({type:"state-request"});
</script></body></html>
