<!doctype html>
<html lang="es">
<head>

<meta name="description" content="Clase 09 de IAEW 2026: Cloud e IaC con AWS Academy.">
<title>Clase 09 · Cloud e IaC con AWS Academy · IAEW 2026</title>
<style>
:root{color-scheme:dark;--navy:#081826;--panel:#0e293c;--cyan:#007f99;--paper:#f5f8fa}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--navy);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#122b3d}
.deck{height:100%;display:grid;place-items:center;padding:16px}
.slide{display:none;position:relative;width:min(100%,calc((100vh - 70px)*16/9));aspect-ratio:16/9;background:var(--paper);border-radius:14px;padding:4.2% 6.4% 5%;overflow:hidden}
.slide.active{display:flex;flex-direction:column;justify-content:center}
.slide:before{content:"";position:absolute;inset:0 auto 0 0;width:12px;background:var(--cyan)}
.slide.dark{background:var(--panel);color:#f8fbfd}.slide.dark:before{background:#35b779}
.kicker{margin:0 0 .7rem;color:var(--cyan);font-size:clamp(12px,1.3vw,17px);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.dark .kicker{color:#67d7e7}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(34px,5.2vw,68px);line-height:1.03;margin-bottom:1rem}h2{font-size:clamp(28px,3.8vw,50px);line-height:1.06;margin-bottom:1.1rem}h3{font-size:clamp(16px,1.7vw,22px);margin-bottom:.4rem}
p,li,td,th{font-size:clamp(14px,1.5vw,20px);line-height:1.4}.subtitle{font-size:clamp(20px,2.3vw,30px);max-width:980px;color:#d9eef8}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
article{padding:15px 18px;background:#e6eef3;border:1px solid #cfdee7;border-radius:12px;min-width:0}.dark article{background:#16374b;border-color:#375467}article p{margin-bottom:0}
.flow{display:flex;align-items:stretch;gap:9px;margin:10px 0 16px}.flow b{flex:1;display:grid;place-items:center;background:#dfebf1;border:1px solid #bed2dc;padding:14px 8px;border-radius:10px;text-align:center;font-size:clamp(13px,1.45vw,19px)}.flow i{align-self:center;font-style:normal;color:var(--cyan);font-weight:800}
.call{margin-top:14px;padding:12px 16px;background:#daf0e9;border-left:5px solid #28a978;border-radius:0 8px 8px 0;font-size:clamp(14px,1.4vw,19px)}.warn{background:#fff1d6;border-left-color:#cc9b3b}
.tag{display:inline-block;margin-top:18px;padding:6px 14px;border:1px solid #67d7e7;border-radius:99px;color:#67d7e7;font-weight:700;font-size:14px}
table{width:100%;border-collapse:collapse;margin-bottom:8px}th{text-align:left;background:#d9e8ef}th,td{padding:7px 11px;border-bottom:1px solid #c9d8e2;font-size:clamp(13px,1.3vw,18px)}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}code{background:#dbe8ee;padding:1px 5px;border-radius:4px;font-size:.92em}
pre{margin:0 0 8px;padding:12px 16px;background:#0b2234;color:#e7f4fb;border-radius:10px;font-size:clamp(12px,1.25vw,17px);line-height:1.4;overflow:hidden}
ul{margin:0;padding-left:1.2em}
.footer{position:absolute;left:6.4%;right:6.4%;bottom:16px;display:flex;gap:12px;font-size:12px;color:#627484}.dark .footer{color:#abc5d7}.footer .slide-no{margin-left:auto}
.nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;color:#cfe3ee;font-size:13px}
button{border:1px solid #446076;background:#143247;color:#fff;border-radius:6px;padding:6px 11px;cursor:pointer}button:hover{background:#20506b}button:focus-visible{outline:3px solid #67d7e7;outline-offset:2px}
.progress{position:fixed;top:0;left:0;height:4px;background:#35b779;transition:width .2s}
@media print{@page{size:1280px 720px;margin:0}html,body{height:auto}.deck{display:block;padding:0}.slide,.slide.active{display:flex;position:relative;width:1280px;height:720px;break-after:page;border-radius:0}.nav,.progress{display:none}}
</style>
</head>
<body>
<main class="deck" id="deck" aria-label="Presentación Clase 09"></main>
<div class="progress" id="progress"></div>
<nav class="nav" aria-label="Controles de presentación">
<button id="prev" aria-label="Diapositiva anterior">←</button><span id="counter" aria-live="polite"></span>
<button id="next" aria-label="Diapositiva siguiente">→</button><button id="presenter">Vista del orador</button><button id="fullscreen">Pantalla completa</button>
</nav>
<script>
const slides=[
{theme:"dark",block:"0–12 min · continuidad",title:"Cloud e IaC<br>con AWS Academy",body:'<p class="subtitle">De una API que funciona en nuestra máquina a un servicio reproducible en un entorno con permisos y tiempo limitados.</p><div class="tag">CLASE 09 · 26/10/2026 · IAEW 2026</div>',notes:"Bienvenida. Hoy salimos de la máquina local. La historia sigue siendo la misma API de pedidos: lo que cambia es dónde corre y cómo lo describimos. Anticipar: la práctica es individual y el despliegue en nube es parte del bono opcional del TPI, no un requisito obligatorio."},
{block:"0–12 min · continuidad",title:"Qué dejamos funcionando",body:'<div class="flow"><b>Cliente</b><i>→</i><b>API</b><i>→</i><b>Broker</b><i>→</i><b>Worker</b></div><div class="grid"><article><h3>Evidencia que ya tenemos</h3><p>Seguridad con Auth0, resiliencia, contratos, observabilidad y un asistente con MCP, todo corriendo con Docker Compose en la máquina de cada uno.</p></article><article><h3>Qué límite aparece</h3><p>Nadie más puede usar ese sistema. Si la máquina se apaga o se reinstala, el entorno se pierde.</p></article></div>',notes:"Recuperar lo que funciona: API, mensajería, seguridad, observabilidad. Pedir un ejemplo concreto de algo que solo anda en su laptop. Introducir el límite: el sistema depende de la máquina y de pasos manuales."},
{block:"0–12 min · continuidad",title:"Tres preguntas abiertas",body:'<div class="grid three"><article><h3>¿Dónde corre?</h3><p>Otro equipo debería poder acceder por una URL estable.</p></article><article><h3>¿Cómo se reproduce?</h3><p>Si hay que recordar 15 pasos manuales, el entorno no es confiable.</p></article><article><h3>¿Qué lo limita?</h3><p>Permisos, costos y tiempo existen incluso en un laboratorio educativo.</p></article></div><div class="call">Puente: infraestructura descrita como código, ejecutada sobre una nube con restricciones reales.</div>',notes:"Formular las tres preguntas y dejar que respondan antes de avanzar. El puente es la noción de Infraestructura como Código (IaC) y el contexto AWS Academy Learner Lab."},
{block:"0–12 min · continuidad",title:"Objetivo y ruta de 120 minutos",body:'<table><tr><th>Bloque</th><th>Min</th></tr><tr><td>Continuidad, necesidad y objetivo</td><td>12</td></tr><tr><td>Cloud, IaC y CloudFormation</td><td>20</td></tr><tr><td>Fargate, ALB, ECR y límites del Learner Lab</td><td>15</td></tr><tr><td>Demostración guiada</td><td>15</td></tr><tr><td>Práctica individual</td><td>45</td></tr><tr><td>Evidencias y limpieza</td><td>8</td></tr><tr><td>Cierre y puente a testing</td><td>5</td></tr></table><div class="call">12 + 20 + 15 + 15 + 45 + 8 + 5 = 120 minutos.</div>',notes:"Mostrar la agenda. Objetivo funcional: leer, validar y desplegar una plantilla que publique la API detrás de un balanceador, y justificar qué recurso cumple qué función. Aclarar que si el Learner Lab no está disponible hay una ruta local que cubre el mínimo obligatorio."},
{block:"12–32 min · cloud e IaC",title:"Qué es usar la nube",body:'<div class="grid"><article><h3>Qué resuelve</h3><p>Capacidad bajo demanda: servidores, redes y balanceadores que se crean con una llamada API en minutos.</p></article><article><h3>Qué no resuelve</h3><p>No elimina el diseño: sigue haciendo falta decidir red, permisos, configuración y observabilidad.</p></article></div><div class="call warn">Pago por uso: un recurso olvidado sigue consumiendo crédito aunque nadie lo use.</div>',notes:"Definir nube como recursos programables bajo demanda. Remarcar costo y responsabilidad: la nube cambia quién administra el hardware, no la necesidad de diseñar. En el laboratorio el crédito es limitado, lo que vuelve concreta la limpieza."},
{block:"12–32 min · cloud e IaC",title:"Infraestructura como código",body:'<div class="grid"><article><h3>Problema</h3><p>Crear recursos con clics es lento, no deja registro y no se puede repetir con certeza.</p></article><article><h3>Idea</h3><p>Un archivo declarativo describe el estado deseado; la herramienta lo crea, lo actualiza o lo elimina.</p></article></div><div class="flow" style="margin-top:16px"><b>Plantilla en Git</b><i>→</i><b>Stack</b><i>→</i><b>Recursos reales</b></div><p>Beneficios: repetible, revisable, versionable y fácil de eliminar completo.</p>',notes:"Contrastar creación manual vs declarativa. Un stack es la unidad que CloudFormation crea y destruye junta. Eliminar el stack elimina todo lo que declaró: esa propiedad es clave para la limpieza."},
{compact:true,block:"12–32 min · cloud e IaC",title:"Anatomía de una plantilla CloudFormation",body:'<pre>Parameters:   # lo que cambia entre entornos\n  ImageUri: { Type: String }\nResources:    # lo que se crea\n  LoadBalancer:\n    Type: AWS::ElasticLoadBalancingV2::LoadBalancer\n  Service:\n    Type: AWS::ECS::Service\n    Properties:\n      TaskDefinition: !Ref TaskDefinition   # dependencia\nOutputs:      # lo que se informa al terminar\n  ApiUrl: { Value: !Sub "http://${LoadBalancer.DNSName}" }</pre><div class="grid three"><article><h3>Parameters</h3><p>Valores externos: imagen, VPC, subredes.</p></article><article><h3>Resources</h3><p>Recursos y cómo se referencian (<code>!Ref</code>, <code>!GetAtt</code>).</p></article><article><h3>Outputs</h3><p>Datos que necesitamos para usar el resultado.</p></article></div>',notes:"Recorrer las tres secciones. Mostrar que !Ref arma el grafo de dependencias: CloudFormation decide el orden de creación. Los Outputs evitan buscar la URL en la consola."},
{block:"12–32 min · cloud e IaC",title:"Cómo se actualiza: change sets y estados",body:'<div class="flow"><b>Cambio en la plantilla</b><i>→</i><b>Change set</b><i>→</i><b>Update</b><i>→</i><b>UPDATE_COMPLETE</b></div><div class="grid"><article><h3>Si falla</h3><p>El stack hace rollback al estado anterior (<code>ROLLBACK_COMPLETE</code> o <code>UPDATE_ROLLBACK_COMPLETE</code>).</p></article><article><h3>Cómo diagnosticar</h3><p>Eventos del stack: indican qué recurso falló y por qué.</p></article></div><div class="call">Aprender a leer eventos de falla es una habilidad central; un error inicial es esperable.</div>',notes:"Explicar que deploy crea un change set y lo ejecuta. Si un recurso falla, el stack vuelve atrás. El ejercicio incluye leer eventos del stack. Un stack en ROLLBACK_COMPLETE tras creación inicial debe eliminarse antes de reintentar."},
{block:"32–47 min · servicios y límites",title:"Del contenedor al servicio público",body:'<div class="flow"><b>Imagen en ECR</b><i>→</i><b>Task definition</b><i>→</i><b>Servicio Fargate</b><i>→</i><b>ALB</b><i>→</i><b>Internet</b></div><div class="grid"><article><h3>ECR</h3><p>Registro privado de imágenes Docker.</p></article><article><h3>Fargate</h3><p>Ejecuta contenedores sin administrar servidores.</p></article><article><h3>ALB</h3><p>Reparte tráfico y chequea <code>/health</code>.</p></article><article><h3>Task definition</h3><p>Imagen, CPU/memoria, puerto, logs y rol.</p></article></div>',notes:"Recorrer la cadena desde la imagen hasta el usuario. Cada pieza resuelve una necesidad: dónde vive la imagen, cómo se ejecuta, cómo se expone, cómo se sabe que está sana. Esta es la misma API sin estado que ya conocen, simplificada."},
{block:"32–47 min · servicios y límites",title:"Por qué la API debe ser stateless",body:'<div class="grid"><article><h3>Stateless</h3><p>Cualquier instancia responde igual; el estado vive en bases o servicios externos.</p></article><article><h3>Consecuencia</h3><p>Fargate puede reemplazar, escalar o reiniciar tareas sin perder datos.</p></article></div><div class="call warn">Por eso hoy desplegamos solo la API. MongoDB y RabbitMQ requieren servicios administrados o almacenamiento persistente; no son parte del alcance de hoy.</div>',notes:"Justificar la elección de alcance: una tarea de Fargate es efímera. La base y el broker necesitan servicios gestionados y excederían el Learner Lab y el tiempo. La API de práctica devuelve datos fijos: no representa el sistema completo."},
{block:"32–47 min · servicios y límites",title:"Límites del Learner Lab",body:'<table><tr><th>Límite</th><th>Consecuencia en la práctica</th></tr><tr><td>Sesión de ~4 h (se reinicia con Start Lab)</td><td>Los recursos pueden detenerse; no es producción</td></tr><tr><td>Crédito limitado</td><td>Eliminar todo al terminar; no dejar ALB activos</td></tr><tr><td>Rol <code>LabRole</code> ya existente</td><td>No se crean roles IAM; se reutiliza <code>LabRole</code></td></tr><tr><td>Servicios y regiones restringidos</td><td>Trabajar en <code>us-east-1</code> y probar antes</td></tr><tr><td>Credenciales temporales</td><td>Renovarlas al reiniciar el lab; nunca subirlas a Git</td></tr></table>',notes:"Estos límites son del AWS Academy Learner Lab y pueden variar según el curso; verificar en la consola antes de clase. Lo importante: restricciones de permisos, tiempo y costo son condiciones reales del trabajo en cloud. Las credenciales temporales no se versionan."},
{block:"47–62 min · demostración",title:"Demostración guiada",body:'<div class="steps"><table><tr><th>Paso</th><th>Qué se muestra</th></tr><tr><td>1</td><td><code>npm test</code> y <code>docker build</code> local</td></tr><tr><td>2</td><td><code>cfn-lint</code> sobre la plantilla</td></tr><tr><td>3</td><td><code>publicar-imagen.sh</code> → ECR</td></tr><tr><td>4</td><td><code>desplegar.sh</code> → stack, eventos y Output</td></tr><tr><td>5</td><td><code>curl</code> a <code>/health</code> y <code>/version</code></td></tr></table></div><div class="call warn">La demo requiere el Learner Lab del docente iniciado antes de clase. Si falla, se muestra la evidencia previa y se continúa con la ruta local.</div>',notes:"Demostración por el docente: el alumno observa, aún no construye. Tener el lab iniciado y una captura previa de respaldo. Mientras el stack se crea (varios minutos), explicar los eventos. Si el lab no está disponible, declararlo y no simular."},
{block:"47–62 min · demostración",title:"Qué miramos al verificar",body:'<div class="grid three"><article><h3>Estado del stack</h3><p><code>CREATE_COMPLETE</code> y recursos creados.</p></article><article><h3>Salud del ALB</h3><p>Destinos en estado <code>healthy</code>.</p></article><article><h3>Respuesta real</h3><p><code>/version</code> devuelve la instancia que atendió.</p></article></div><div class="call">Una plantilla válida no prueba que el servicio funcione; la prueba es la respuesta HTTP desde la URL del Output.</div>',notes:"Separar tres niveles de evidencia: lint (sintaxis), stack (creación) y HTTP (funcionamiento). Cada uno responde una pregunta distinta."},
{block:"62–107 min · práctica individual",title:"Práctica individual (45 min)",body:'<table><tr><th>Parte</th><th>Tarea</th><th>Nivel</th></tr><tr><td>A</td><td>Tabla recurso → necesidad que cubre</td><td>Obligatoria</td></tr><tr><td>B</td><td><code>npm test</code>, imagen local y <code>cfn-lint</code></td><td>Obligatoria</td></tr><tr><td>C</td><td>Publicar imagen y desplegar el stack; verificar URL</td><td>Obligatoria si hay lab; si no, ruta local</td></tr><tr><td>D</td><td>Cambiar <code>DesiredCount</code> a 2 y observar <code>/version</code></td><td>Obligatoria si hay lab</td></tr><tr><td>E</td><td>Limpiar y evidenciar</td><td>Obligatoria</td></tr></table><p>Entregable: nota breve con evidencias y decisiones. Consigna en <code>actividad-practica.md</code>.</p>',notes:"Presentar el alcance obligatorio. Cada parte tiene respaldo: A en diapositivas de anatomía y cadena de servicios; B en la demo; C y D en demo y límites; E en límites del lab. Quien no tenga lab completa A, B, E y una explicación escrita de C y D."},
{block:"107–115 min · evidencias y limpieza",title:"Evidencias y limpieza",body:'<div class="grid"><article><h3>Qué entregar</h3><ul><li>Tabla de recursos y justificación</li><li>Salida de tests y lint</li><li>Eventos del stack y respuesta de <code>/version</code></li><li>Confirmación de borrado</li></ul></article><article><h3>Cómo limpiar</h3><p><code>./scripts/limpiar.sh</code> elimina el stack y el repositorio ECR. Verificar que no queden stacks ni balanceadores.</p></article></div><div class="call warn">Distinguir lo observado de lo supuesto: si no pudieron ejecutar algo, escríbanlo.</div>',notes:"Pedir evidencia verificable, no solo capturas de la consola. La limpieza es parte del trabajo: dejar recursos activos consume crédito. Registrar qué no se pudo ejecutar."},
{theme:"dark",block:"115–120 min · cierre",title:"Cierre y puente a testing",body:'<div class="grid"><article><h3>Idea para llevarse</h3><p>Infraestructura reproducible, permisos mínimos y limpieza forman parte del diseño de una integración.</p></article><article><h3>Próxima clase · 02/11</h3><p>Testing de integración y contratos: cómo comprobar que lo que desplegamos funciona de punta a punta.</p></article></div><div class="call">El despliegue cloud es opcional y suma bono en el TPI; no reemplaza los requisitos de la consigna.</div>',notes:"Recuperar la idea central y avanzar a testing: ya tenemos una URL; falta probar contratos, errores y casos borde de forma sistemática. Recordar que 09/11 es feriado y la Entrega 2 del TPI es el 16/11."}
];
const deck=document.querySelector("#deck");let current=0;const presenterChannel="BroadcastChannel"in window?new BroadcastChannel("iaew-clase-09-presenter"):null;
function render(){deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme||""} ${i===current?"active":""}" aria-label="Diapositiva ${i+1}"><p class="kicker">${s.block}</p><h2>${s.title}</h2><div class="slide-content">${s.body}</div><div class="footer"><span>IAEW 2026 · Clase 09 · Cloud e IaC con AWS Academy</span><span class="slide-no">${i+1} / ${slides.length}</span></div></section>`).join("");document.querySelector("#counter").textContent=`${current+1} / ${slides.length}`;document.querySelector("#progress").style.width=`${(current+1)/slides.length*100}%`;publish()}
function publish(){const s=slides[current],message={source:"deck",type:"state",current,total:slides.length,kicker:s.block,title:s.title.replace(/<br\s*\/?>/gi," "),notes:s.notes,nextTitle:slides[current+1]?.title.replace(/<br\s*\/?>/gi," ")||"Fin",sentAt:Date.now()};if(presenterChannel)presenterChannel.postMessage(message);try{localStorage.setItem("iaew-clase-09-presenter-state",JSON.stringify(message))}catch{}}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}
document.querySelector("#prev").onclick=()=>go(current-1);document.querySelector("#next").onclick=()=>go(current+1);document.querySelector("#presenter").onclick=()=>window.open("presenter.html","iaew-clase-09-presenter","width=1100,height=820");document.querySelector("#fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(current+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(current-1)}if(e.key.toLowerCase()==="p")window.open("presenter.html","iaew-clase-09-presenter","width=1100,height=820");if(e.key.toLowerCase()==="f")document.querySelector("#fullscreen").click()});
addEventListener("storage",e=>{if(e.key==="iaew-clase-09-presenter-message"&&e.newValue){const msg=JSON.parse(e.newValue);if(msg.type==="navigate")go(msg.index)}});if(presenterChannel)presenterChannel.onmessage=e=>{if(e.data?.source==="presenter"&&e.data.type==="navigate")go(e.data.index);if(e.data?.source==="presenter"&&e.data.type==="state-request")publish()}
render();
</script></body></html>
