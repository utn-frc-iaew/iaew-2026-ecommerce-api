const slides=[
  {
    "block": "0–10 min · el punto de partida",
    "title": "De Docker Compose<br>a la nube",
    "body": "<p class=\"subtitle\">Nuestra API ya funciona localmente. ¿Cómo la hacemos accesible y reproducible fuera de nuestra computadora?</p><div class=\"tag\">CLASE 09 · 26/10/2026 · Integración de Aplicaciones en Entorno Web</div>",
    "notes": "El título marca el recorrido de hoy: partimos de servicios que ya sabemos ejecutar y vamos a decidir dónde alojarlos y cómo crear su infraestructura. Al terminar podremos explicar y verificar el camino desde una imagen hasta una URL pública.",
    "theme": "dark"
  },
  {
    "block": "0–10 min · el punto de partida",
    "title": "Lo que dejamos funcionando",
    "body": "<div class=\"flow\"><b>API de pedidos</b><i>→</i><b>RabbitMQ</b><i>→</i><b>Worker</b><i>→</i><b>MongoDB</b></div><div class=\"grid\"><article><h3>Evidencia local</h3><p>Consultamos la API, procesamos pedidos y observamos resultados. En Clase 08 sumamos un host y herramientas MCP.</p></article><article><h3>Herramienta conocida</h3><p>Compose describe los servicios locales. El host conversacional se inicia aparte; no todo el sistema es un contenedor.</p></article></div>",
    "notes": "En el diagrama vemos el flujo de integración que venimos construyendo. La API recibe, el broker desacopla, el worker procesa y MongoDB persiste. Recuperemos una evidencia: ¿qué respuesta o cambio de estado vimos? El asistente de Clase 08 consume esta integración; hoy cambiaremos dónde ejecutamos una parte del backend.",
    "theme": ""
  },
  {
    "block": "0–10 min · el punto de partida",
    "title": "Una nueva demanda del mismo sistema",
    "body": "<div class=\"grid\"><article><h3>Pedido del equipo</h3><p>“Necesitamos mostrar la API desde otra computadora, aunque la laptop del desarrollador esté apagada”.</p></article><article><h3>Preguntas que aparecen</h3><p>¿Qué máquina la ejecuta? ¿Cómo llega el tráfico? ¿Dónde quedan los datos? ¿Quién mantiene el entorno?</p></article></div><div class=\"call\">Compose ya aporta reproducibilidad local. Ahora necesitamos aprovisionamiento y operación remotos.</div>",
    "notes": "Las dos tarjetas separan la demanda de las decisiones. Compartir localhost no alcanza: localhost pertenece a quien hace la solicitud. Pregunta: si copiamos el compose.yaml a otra máquina, ¿ya tenemos red, permisos y una URL pública? Respuesta esperada: todavía hay que preparar ese entorno.",
    "theme": ""
  },
  {
    "block": "0–10 min · el punto de partida",
    "title": "La ruta de hoy",
    "body": "<table><tr><th>Bloque</th><th>Minutos</th></tr><tr><td>Recuperar Compose y plantear el problema</td><td>10</td></tr><tr><td>Nube y modelos de servicio</td><td>15</td></tr><tr><td>Traducir Compose a ECS/Fargate</td><td>20</td></tr><tr><td>IaC, CloudFormation y demo</td><td>15</td></tr><tr><td>Práctica individual A–E</td><td>45</td></tr><tr><td>Verificación de cierre y conclusiones</td><td>15</td></tr></table><div class=\"call\">Resultado: una API ficticia de solo lectura publicada por ALB.</div>",
    "notes": "Recorramos la tabla: son 120 minutos. La práctica dura 45 y requiere imagen y linter preparados. Primero entenderemos decisiones; después leeremos el código que las implementa. Todos cuentan con Learner Lab. Las partes A–E son obligatorias, incluido desplegar, escalar y limpiar en AWS.",
    "theme": ""
  },
  {
    "block": "10–25 min · entender la nube",
    "title": "¿Qué significa usar la nube?",
    "body": "<div class=\"flow\"><b>Necesidad de capacidad</b><i>→</i><b>API del proveedor</b><i>→</i><b>Recurso disponible</b></div><div class=\"grid\"><article><h3>Recursos bajo demanda</h3><p>Cómputo, red y almacenamiento que solicitamos sin comprar y montar hardware propio.</p></article><article><h3>Uso medido</h3><p>La capacidad tiene costo y límites. Debemos elegir tamaño, controlar uso y liberar recursos.</p></article></div>",
    "notes": "La secuencia muestra la idea central: solicitamos recursos programables al proveedor. Una máquina virtual es un ejemplo, no la definición completa de nube. La capacidad puede ajustarse a la necesidad; eso no significa que nuestra aplicación escale automáticamente ni que operar sea gratis.",
    "theme": ""
  },
  {
    "block": "10–25 min · entender la nube",
    "title": "Ubicación, capacidad y responsabilidades",
    "body": "<div class=\"grid\"><article><h3>Región y zona</h3><p>Una región es un área geográfica; contiene zonas de disponibilidad separadas. Elegimos dónde viven los recursos.</p></article><article><h3>Escalabilidad y elasticidad</h3><p>Escalar es aumentar o reducir capacidad. Elasticidad es ajustarla a la demanda; requiere configuración y controles.</p></article><article><h3>Disponibilidad</h3><p>Dos tareas pueden reducir dependencia de un proceso. Persistencia, red y dependencias también deben diseñarse.</p></article><article><h3>Responsabilidad compartida</h3><p>El proveedor opera las capas contratadas; nosotros conservamos responsabilidad por datos, código y configuración.</p></article></div>",
    "notes": "Las cuatro tarjetas responden dónde, cuánto, con qué continuidad y bajo qué responsabilidad. En el laboratorio elegimos una región y subredes de dos zonas para el balanceador. No confundamos esa configuración con una garantía de disponibilidad de todo el sistema.",
    "theme": ""
  },
  {
    "block": "10–25 min · entender la nube",
    "title": "IaaS, PaaS y SaaS: ¿quién administra qué?",
    "body": "<table><tr><th>Modelo</th><th>Qué recibimos</th><th>Qué administramos</th></tr><tr><td>IaaS · infraestructura</td><td>Máquinas virtuales, red y discos</td><td>SO de la VM, runtime, aplicación y datos</td></tr><tr><td>PaaS · plataforma</td><td>Entorno administrado para desplegar código</td><td>Aplicación, datos y configuración permitida</td></tr><tr><td>SaaS · software</td><td>Aplicación lista para usar</td><td>Usuarios, datos y opciones del servicio</td></tr></table><div class=\"call\">A mayor nivel de servicio, delegamos más operación y aceptamos más decisiones de la plataforma.</div>",
    "notes": "Leamos la tabla de izquierda a derecha. En infraestructura contratamos capacidad; en plataforma desplegamos nuestra aplicación; en software usamos una aplicación ya provista. Son modelos de responsabilidad. No son pasos obligatorios de una migración ni niveles de calidad.",
    "theme": ""
  },
  {
    "block": "10–25 min · entender la nube",
    "title": "Aplicar los modelos a nuestro caso",
    "body": "<div class=\"grid\"><article><h3>IaaS: capacidad de infraestructura</h3><p>Contratamos máquinas virtuales, red y discos. Administramos el sistema operativo y el software instalado.</p></article><article><h3>PaaS: desplegar la API</h3><p>Entregamos código o artefactos a una plataforma; operamos dentro de sus opciones y restricciones.</p></article><article><h3>SaaS: consumir software</h3><p>Usamos, por ejemplo, una aplicación de correo. No desplegamos nuestro backend dentro de ella.</p></article><article><h3>Hoy: contenedores administrados</h3><p>Usaremos Amazon ECS (Elastic Container Service) con Fargate. AWS administra la capacidad de ejecución; definimos imagen, recursos, red y permisos.</p></article></div>",
    "notes": "Las tarjetas llevan los modelos al problema. Fargate es ejecución administrada de contenedores, sin gestionar las máquinas que la sostienen; no lo vamos a etiquetar como SaaS ni a equiparar todos los servicios administrados con un único modelo. La pregunta útil es qué delegamos y qué debemos configurar.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "Primero: leer nuestro Compose real",
    "body": "<pre>services:\n  api:\n    # hereda build y environment del bloque x-app\n    command: [node, src/app.js]\n    ports: [&quot;127.0.0.1:${API_PORT:-3008}:3000&quot;]\n  mongodb:\n    image: mongo:7.0.21\n    volumes: [mongo-data:/data/db]</pre><div class=\"call\">Extracto de Clase 08: proceso, acceso local y persistencia son decisiones diferentes.</div>",
    "notes": "En el extracto vemos la API y MongoDB; no es un archivo completo para ejecutar. La API hereda construcción y configuración del bloque común. El puerto se publica solo en loopback; el volumen conserva los datos de MongoDB. RabbitMQ y worker también existen en el Compose real. ¿Qué parte necesitamos resolver fuera del equipo? La capacidad, red y persistencia que ahora provee la máquina local.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "De Compose a un administrador de contenedores",
    "body": "<div class=\"flow\"><b>Servicios e imágenes conocidos</b><i>→</i><b>Estado deseado</b><i>→</i><b>Contenedores administrados</b></div><div class=\"grid\"><article><h3>Punto de partida</h3><p>Compose describe procesos, imágenes, configuración y conexiones de nuestro entorno local.</p></article><article><h3>Necesidad en la nube</h3><p>Programar la ejecución, mantener la cantidad deseada, reemplazar tareas y conectar destinos saludables.</p></article></div><div class=\"call\">Llevamos las imágenes y decisiones de servicio a ECS; adaptamos red, permisos y persistencia al entorno cloud.</div>",
    "notes": "La secuencia parte de los servicios que ya reconocemos y agrega administración de su ejecución remota. No trasladamos el archivo Compose como una traducción automática: usamos sus decisiones para definir tareas, servicios y conexiones en AWS. El administrador mantiene el estado deseado, por ejemplo una tarea activa, y reemplaza tareas cuando corresponde. La siguiente diapositiva distingue quién coordina y quién aporta la ejecución.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "ECS administra; Fargate ejecuta",
    "body": "<div class=\"flow\"><b>Imagen en ECR</b><i>→</i><b>TaskDefinition</b><i>→</i><b>Service ECS + Fargate</b></div><table><tr><th>Pieza</th><th>Responsabilidad en nuestra actividad</th></tr><tr><td>TaskDefinition</td><td>Define imagen, CPU/memoria, puerto, configuración, logs y roles.</td></tr><tr><td>Service de ECS</td><td>Mantiene DesiredCount y registra las tareas en el TargetGroup.</td></tr><tr><td>Fargate</td><td>Ejecuta los contenedores sin administrar las máquinas subyacentes.</td></tr><tr><td>Equipo</td><td>Define código, imagen, recursos, red, permisos y estado externo.</td></tr></table>",
    "notes": "En la fila superior vemos la imagen publicada, la definición de ejecución y el servicio. La tabla separa responsabilidades: ECS es el administrador de tareas y servicios; Fargate aporta la ejecución sin que gestionemos instancias EC2. Una definición de tarea no mantiene por sí sola la cantidad deseada: lo hace el servicio. Seguimos siendo responsables por nuestra configuración y dependencias. Ahora concretaremos qué API y recursos vamos a levantar.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "Qué vamos a levantar en AWS",
    "body": "<p>Desde tu equipo: solicitudes HTTP a una URL pública.</p><div class=\"cloud-boundary\"><h3>AWS · us-east-1 · ambiente de la actividad</h3><div class=\"flow\"><b>ALB público :80</b><i>→</i><b>API Node.js :8080<br>1 tarea Fargate → 2 en D</b></div><div class=\"grid\"><article><h3>Artefacto y operación</h3><p>Imagen en ECR (<code>iaew-api:1.0.0</code>), reglas de red y logs en CloudWatch.</p></article><article><h3>Qué responde la API</h3><p><code>/health</code>, <code>/version</code>, <code>/pedidos</code> y <code>/pedidos/P-1001</code>: JSON con datos fijos.</p></article></div></div><div class=\"call\">Sin base, broker, worker, Auth0 ni MCP. ECR está fuera del stack; la VPC, subredes y LabRole ya existen.</div>",
    "notes": "En el recuadro vemos el destino de la actividad: una API Node.js ejecutada en una tarea Fargate y accesible por el ALB. El cliente está fuera de AWS: la flecha indica su entrada al balanceador; no es un recurso que creemos. La imagen vive en ECR, fuera del stack, y ECS la descarga para iniciar la tarea. CloudWatch recibe logs. Las cuatro rutas devuelven JSON, no una pantalla web. En D mantenemos dos tareas de la misma API. No desplegamos los componentes de la integración previa ni migramos sus pedidos: estos datos están fijos en el código. La guía única muestra qué comprobar en cada paso.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "Traducir Compose: imagen y ejecución",
    "body": "<table><tr><th>Lo conocido</th><th>Necesidad remota</th><th>Pieza de hoy</th></tr><tr><td>build / Dockerfile</td><td>Construir una imagen transportable</td><td>docker build: linux/amd64</td></tr><tr><td>Imagen en la máquina</td><td>Almacenar y descargar el artefacto</td><td>ECR: Elastic Container Registry</td></tr><tr><td>command / environment</td><td>Definir proceso y configuración</td><td>TaskDefinition de ECS</td></tr><tr><td>Servicio en ejecución</td><td>Mantener la cantidad deseada</td><td>Service + ejecución Fargate</td></tr></table><div class=\"call\">La imagen es el artefacto; la infraestructura define dónde y bajo qué condiciones se ejecuta.</div>",
    "notes": "Recorramos cada fila desde lo conocido. Construir no es publicar y publicar no es ejecutar. ECR contiene la imagen, no recibe tráfico de los usuarios. La definición de tarea describe el contenedor; el servicio mantiene su cantidad. La imagen actual escucha en 8080, no en el 3000 del proyecto anterior.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "Traducir Compose: red, salud y datos",
    "body": "<table><tr><th>Lo conocido</th><th>Decisión que aparece en AWS</th></tr><tr><td>ports</td><td>Entrada pública por ALB:80 y destino tarea:8080</td></tr><tr><td>Red de servicios</td><td>VPC, subredes y reglas de comunicación</td></tr><tr><td>healthcheck</td><td>Target Group comprueba GET /health</td></tr><tr><td>environment</td><td>Configurar valores; gestionar secretos aparte</td></tr><tr><td>volumes</td><td>Persistencia externa diseñada para los datos</td></tr></table><div class=\"call\">Son correspondencias de necesidades; no equivalencias exactas entre campos y recursos.</div>",
    "notes": "Las filas separan necesidades que Compose ayuda a expresar localmente. Un security group no es una red Docker y el health check del ALB no es el health check del contenedor. Hoy no hay secretos de aplicación en la API ni volumen de datos: son decisiones simplificadas explícitamente.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "Dos caminos distintos: artefacto y solicitudes",
    "body": "<div class=\"flow\"><b>Dockerfile</b><i>→</i><b>Imagen → ECR</b><i>→</i><b>ECS descarga y ejecuta</b></div><div class=\"flow\"><b>Cliente</b><i>→</i><b>ALB :80</b><i>→</i><b>Tarea API :8080</b></div><div class=\"call\">ALB significa Application Load Balancer. ECR participa al iniciar una tarea. Las solicitudes HTTP viajan del cliente al ALB y de allí a la API.</div>",
    "notes": "Vemos dos filas: arriba se mueve el artefacto y abajo se atienden solicitudes. Este contraste evita pensar que ECR es parte del camino HTTP. El balanceador dirige solicitudes hacia tareas saludables. CloudFormation creará la estructura que permite ambos caminos.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "La red que habilita ese camino",
    "body": "<div class=\"grid\"><article><h3>VPC y subredes</h3><p>Usamos la red virtual por defecto y dos subredes públicas en zonas distintas. El script las consulta; no las crea.</p></article><article><h3>Reglas de entrada</h3><p>AlbSecurityGroup permite TCP 80 público. TaskSecurityGroup permite TCP 8080 desde el grupo del ALB.</p></article></div><div class=\"flow\"><b>Internet</b><i>→</i><b>ALB · puerto 80</b><i>→</i><b>API · puerto 8080</b></div><div class=\"call\">Las tareas reciben IP pública para conectividad saliente; su puerto de aplicación solo acepta al ALB.</div>",
    "notes": "En el diagrama el tráfico entra por el balanceador. Las tarjetas explican el contexto de red y las reglas. Los grupos de seguridad filtran tráfico y las subredes ubican recursos. El laboratorio usa HTTP y datos ficticios durante una sesión breve; un despliegue real necesita diseñar HTTPS e identidad.",
    "theme": ""
  },
  {
    "block": "25–45 min · del entorno local a AWS",
    "title": "Permisos: dos funciones, un rol del lab",
    "body": "<table><tr><th>Referencia de la plantilla</th><th>Para qué sirve</th></tr><tr><td>ExecutionRoleArn</td><td>ECS descarga la imagen y envía logs</td></tr><tr><td>TaskRoleArn</td><td>Permisos del código para llamar APIs AWS</td></tr></table><div class=\"grid\"><article><h3>Restricción educativa</h3><p>Ambas referencias usan el LabRole existente. No creamos roles IAM propios.</p></article><article><h3>Responsabilidad del equipo</h3><p>La API de hoy no necesita llamar APIs AWS. En producción separaríamos funciones y permisos mínimos.</p></article></div>",
    "notes": "La tabla muestra dos funciones que pueden compartir un rol en este entorno. El rol de ejecución lo usa la infraestructura de ejecución; el rol de tarea está disponible para la aplicación. Reutilizar LabRole es una restricción del curso, no una recomendación general de permisos. Debemos confirmar que el rol y los servicios estén habilitados.",
    "theme": ""
  },
  {

function render(){deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme||""} ${i===current?"active":""}" aria-label="Diapositiva ${i+1}"><p class="kicker">${s.block}</p><h2>${s.title}</h2><div class="slide-content">${s.body}</div><div class="footer"><span>IAEW 2026 · Clase 09 · Cloud e IaC con AWS Academy</span><span class="slide-no">${i+1} / ${slides.length}</span></div></section>`).join("");document.querySelector("#counter").textContent=`${current+1} / ${slides.length}`;document.querySelector("#progress").style.width=`${(current+1)/slides.length*100}%`;publish()}
function publish(){const s=slides[current],message={source:"deck",type:"state",current,total:slides.length,kicker:s.block,title:s.title.replace(/<br\s*\/?>/gi," "),notes:s.notes,nextTitle:slides[current+1]?.title.replace(/<br\s*\/?>/gi," ")||"Fin",sentAt:Date.now()};if(presenterChannel)presenterChannel.postMessage(message);try{localStorage.setItem("iaew-clase-09-presenter-state",JSON.stringify(message))}catch{}}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}
document.querySelector("#prev").onclick=()=>go(current-1);document.querySelector("#next").onclick=()=>go(current+1);document.querySelector("#presenter").onclick=()=>window.open("presenter.html","iaew-clase-09-presenter","width=1100,height=820");document.querySelector("#fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
