    "notes": "El título marca el recorrido de hoy: partimos de servicios que ya sabemos ejecutar y vamos a decidir dónde alojarlos y cómo crear su infraestructura. Al terminar podremos explicar y verificar el camino desde una imagen hasta una URL pública.",

    "notes": "En el diagrama vemos el flujo de integración que venimos construyendo. La API recibe, el broker desacopla, el worker procesa y MongoDB persiste. Recuperemos una evidencia: ¿qué respuesta o cambio de estado vimos? El asistente de Clase 08 consume esta integración; hoy cambiaremos dónde ejecutamos una parte del backend.",

    "body": "<div class=\"flow\"><b>Consola: clics manuales</b><i>→</i><b>Archivo que describe lo que debe existir</b><i>→</i><b>Mismos recursos, cada vez</b></div><div class=\"grid\"><article><h3>Problema</h3><p>Crear VPC, balanceador, cluster y servicios a mano es lento, difícil de repetir, de revisar y de borrar sin olvidar nada.</p></article><article><h3>Infraestructura como código (IaC)</h3><p>Describir la infraestructura en archivos de texto versionables. El archivo se revisa, se valida, se vuelve a ejecutar y se elimina junto con lo que creó.</p></article></div><div class=\"call\">Compose ya describe el entorno local en un archivo. IaC aplica la misma idea a red, balanceador y servicios en la nube.</div>",

    "body": "<div class=\"flow\"><b>Plantilla YAML</b><i>→</i><b>Stack</b><i>→</i><b>Recursos reales en AWS</b></div><table><tr><th>Concepto</th><th>Qué es</th><th>En la actividad</th></tr><tr><td>Plantilla</td><td>Archivo YAML que declara recursos y parámetros</td><td>infra-base.yaml y ecs-fargate-alb.yaml</td></tr><tr><td>Stack</td><td>Conjunto de recursos creado, actualizado y eliminado como una unidad</td><td>iaew-clase-09-base e iaew-clase-09</td></tr><tr><td>Recurso</td><td>Cada pieza de AWS que se declara</td><td>VPC, ALB, cluster, TaskDefinition, Service</td></tr><tr><td>Outputs / Exports</td><td>Valores que un stack publica para otro</td><td>La aplicación los importa de la base</td></tr></table><div class=\"call\">Declaramos qué debe existir; CloudFormation determina el orden, crea, actualiza y elimina.</div>",
    "notes": "CloudFormation es el servicio de AWS que ejecuta infraestructura como código. Escribimos una plantilla en YAML con los recursos que queremos y se la entregamos a CloudFormation, que crea un stack: el conjunto de recursos tratado como una unidad. Si cambiamos la plantilla y actualizamos, calcula la diferencia como change set y modifica solo lo necesario; si borramos el stack, elimina lo que creó. Es declarativo: no escribimos pasos, describimos el resultado, y CloudFormation resuelve el orden según las dependencias. Hoy usamos dos plantillas, una para la base y otra para la aplicación, conectadas por Outputs, Exports e importaciones. Es una de varias herramientas de IaC; Terraform u OpenTofu cumplen un rol similar fuera de AWS. En la actividad cfn-lint revisa la plantilla localmente, sin crear nada.",
