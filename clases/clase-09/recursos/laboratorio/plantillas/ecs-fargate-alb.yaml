AWSTemplateFormatVersion: "2010-09-09"
Description: IAEW Clase 09 - contenedores sobre la infraestructura base creada por el alumno
Parameters:
  BaseStackName:
    Type: String
    Default: iaew-clase-09-base
  ImageUri:
    Type: String
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2
Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      # Permiso provisto por el Learner Lab; no es una dependencia de red.
      ExecutionRoleArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole
      # La API no llama servicios AWS: no se asigna TaskRoleArn.
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8080}]
          Environment: [{Name: APP_VERSION, Value: "1.0.0"}]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${BaseStackName}-LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster:
        Fn::ImportValue: !Sub ${BaseStackName}-ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            Fn::Split:
              - ','
              - Fn::ImportValue: !Sub ${BaseStackName}-SubnetIds
          SecurityGroups:
            - Fn::ImportValue: !Sub ${BaseStackName}-TaskSecurityGroupId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn:
            Fn::ImportValue: !Sub ${BaseStackName}-TargetGroupArn
Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
