AWSTemplateFormatVersion: "2010-09-09"
Description: IAEW Clase 09 - API y MongoDB como contenedores de una misma tarea, sobre la infraestructura base del alumno
Parameters:
  BaseStackName:
    Type: String
    Default: iaew-clase-09-base
  ImageUri:
    Type: String
  MongoImage:
    Type: String
    Default: mongo:7.0.21
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2
Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      # Permiso provisto por el Learner Lab; no es una dependencia de red.
      ExecutionRoleArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole
      # La API no llama servicios AWS: no se asigna TaskRoleArn.
      ContainerDefinitions:
        # MongoDB comparte red con la API: se alcanza por localhost. Sin volumen, los datos duran lo que la tarea.
        - Name: mongodb
          Image: !Ref MongoImage
          Essential: true
          HealthCheck:
            Command: [CMD-SHELL, "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
            Interval: 10
            Timeout: 5
            Retries: 6
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${BaseStackName}-LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mongodb
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          DependsOn: [{ContainerName: mongodb, Condition: HEALTHY}]
          PortMappings: [{ContainerPort: 8080}]
          Environment:
            - {Name: APP_VERSION, Value: "1.0.0"}
            - {Name: MONGODB_URI, Value: "mongodb://localhost:27017/iaew_clase09"}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${BaseStackName}-LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster:
        Fn::ImportValue: !Sub ${BaseStackName}-ClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            Fn::Split:
              - ','
              - Fn::ImportValue: !Sub ${BaseStackName}-SubnetIds
          SecurityGroups:
            - Fn::ImportValue: !Sub ${BaseStackName}-TaskSecurityGroupId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn:
            Fn::ImportValue: !Sub ${BaseStackName}-TargetGroupArn
Outputs:
  ServiceName:
    Value: !GetAtt Service.Name
