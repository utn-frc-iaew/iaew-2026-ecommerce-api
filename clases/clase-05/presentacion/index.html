<script>

["dark","CLASE 05 · RESILIENCIA","Una confirmación,<br>un solo efecto",'<div class="visual-grid"><div><p class="subtitle">Idempotencia HTTP, retry con TTL, DLQ y deduplicación en el e-commerce de Clase 04.</p><div class="tag">ACTIVIDAD INDIVIDUAL · 120 MINUTOS · A1–A8</div></div><div><img class="visual hero" src="assets/resiliencia-ecommerce.png" alt="Comparación entre una integración que duplica efectos y otra que usa identidad, retry, DLQ y deduplicación"><p class="visual-caption">De una repetición peligrosa a un efecto controlado y observable.</p></div></div>'],
["","CONTINUIDAD · CLASE 04","¿Qué dejamos funcionando?",'<div class="flow"><b>Cliente<small>Bearer token</small></b><i>→</i><b>API Express<small>confirma y descuenta stock</small></b><i>→</i><b>RabbitMQ<small>pedido.confirmado</small></b><i>→</i><b>Worker<small>procesa y hace ack</small></b></div><div class="grid three"><article><h3>Seguridad</h3><p>JWT y scope <code>confirm:pedidos</code>.</p></article><article><h3>Evento</h3><p>Publicación asíncrona persistente.</p></article><article><h3>Evidencia</h3><p>Pedido <code>procesada</code> y cola en cero.</p></article></div><div class="call">La Clase 04 resolvió el camino exitoso. Hoy analizamos qué ocurre cuando ese mismo flujo se repite o falla.</div>'],

["","PUENTE · CLASE 04 → CLASE 05","Cada falla de ayer define una protección de hoy",'<table><tr><th>Lo que ya existe</th><th>Qué puede fallar</th><th>Qué agregamos</th></tr><tr><td>Confirmación HTTP</td><td>Respuesta perdida o repetida</td><td><b>Idempotencia</b></td></tr><tr><td>Worker consumidor</td><td>Falla transitoria</td><td><b>Retry con TTL y límite</b></td></tr><tr><td>Entrega at least once</td><td>El mismo evento vuelve</td><td><b>Deduplicación</b></td></tr><tr><td>Mensaje inválido o agotado</td><td>No puede procesarse</td><td><b>DLQ observable</b></td></tr></table><div class="call">Objetivo: repetir sin duplicar y fallar sin perder visibilidad. El recorrido será concepto → acción → checkpoint.</div>'],
["","A1 · ACCIÓN","Elegir un punto de partida",'<div class="grid"><article><h3>A · Tu código acumulado</h3><pre><code>git status\ngit switch -c trabajo-clase-05</code></pre><p>Requiere Clase 04 completa y funcionando.</p></article><article><h3>B · Base común</h3><pre><code>git fetch origin\ngit switch clase-05-inicio\ngit switch -c trabajo-clase-05</code></pre><p>Clase 04 resuelta, sin adelantar Clase 05.</p></article></div><div class="call">Elegí un solo camino. Luego ejecutá <code>npm ci</code>, copiá <code>.env.example</code> y prepará MongoDB/RabbitMQ.</div>'],

["","A2 · CONCEPTO","Una clave identifica una intención HTTP",'<div class="grid"><article><h3>Contrato</h3><p><code>Idempotency-Key</code>: 8–128 caracteres, patrón <code>[A-Za-z0-9._:-]</code>.</p></article><article><h3>Persistencia</h3><p><code>unique</code> impide dos pedidos por clave; <code>sparse</code> permite pedidos sin clave.</p></article></div><div class="call">La clave no es un token y no debe contener secretos.</div>'],
["","A2 · ACCIÓN","Agregar identidad y evento al Pedido",'<pre><code>// src/models/Pedido.js\nconfirmacionIdempotencyKey: {\n  type: String, unique: true, sparse: true\n},\nconfirmacionEvento: {\n  eventId: String, type: String, version: Number,\n  occurredAt: String, data: { pedidoId: String }\n}</code></pre>'],

["","A3 · CONCEPTO","Resolver replay antes de volver a confirmar",'<img class="visual" src="assets/idempotencia-replay.svg" alt="La primera solicitud con clave K aplica el efecto y crea E1; el replay devuelve E1 sin cambiar stock"><div class="call">La búsqueda por clave ocurre antes del descuento: ese orden convierte la repetición en consulta.</div>'],
["","A3 · ACCIÓN","Implementar el replay literal",'<pre><code>if (pedido.estado === "confirmado" &amp;&amp;\n    pedido.confirmacionIdempotencyKey === key &amp;&amp;\n    pedido.confirmacionEvento) {\n  res.set("Idempotency-Replayed", "true");\n  return res.status(200).json({\n    pedido,\n    evento: pedido.confirmacionEvento,\n    idempotencia: { key, replayed: true }\n  });\n}</code></pre>'],

["","A4 · ACCIÓN","Configurar TTL y dead-letter de regreso",'<pre><code>await channel.assertQueue(RETRY_QUEUE, {\n  durable: true,\n  arguments: {\n    "x-message-ttl": retryDelayMs,\n    "x-dead-letter-exchange": EXCHANGE,\n    "x-dead-letter-routing-key": ROUTING_KEY\n  }\n});\nawait channel.bindQueue(\n  RETRY_QUEUE, RETRY_EXCHANGE, ROUTING_KEY\n);</code></pre>'],
["","A4 · CHECKPOINT","Republicar preservando el mensaje",'<div class="grid"><article><h3><code>publishRetry</code></h3><p>Recibe <code>(activeChannel, message, retryCount, reason)</code>. Copia propiedades y conserva <code>messageId</code>.</p><p>Actualiza <code>x-retry-count</code> y agrega <code>x-last-error</code>.</p></article><article><h3><code>publishDlq</code></h3><p>Recibe <code>(activeChannel, message, reason, retryCount)</code>. Conserva <code>x-retry-count</code> y agrega <code>x-dlq-reason</code>.</p></article></div><div class="call">Ambas usan <code>confirmedPublish</code> y esperan <code>waitForConfirms()</code> antes del ack original.</div>'],
["","A5 · CONCEPTO","Clasificar antes de reintentar",'<table><tr><th>Resultado</th><th>Destino</th></tr><tr><td><code>TransientMessageError</code> y quedan intentos</td><td>Retry</td></tr><tr><td><code>PermanentMessageError</code></td><td>DLQ directa</td></tr><tr><td>Falla no permanente agotada</td><td>DLQ</td></tr><tr><td>Éxito o duplicado</td><td>Ack</td></tr></table>'],

["","A6 · CONCEPTO","At least once exige deduplicación",'<div class="flow"><b>Aplicar efecto</b><i>→</i><b class="failure">Cae antes del ack</b><i>→</i><b>Redelivery</b><i>→</i><b>mismo eventId</b></div><div class="call"><code>Idempotency-Key</code> identifica la intención HTTP; <code>eventId</code> identifica el hecho publicado.</div>'],
["","A6 · ACCIÓN","Crear EventoProcesado exactamente como el modelo",'<pre><code>const eventoProcesadoSchema = new mongoose.Schema({\n  eventId: { type: String, required: true, unique: true },\n  type: { type: String, required: true },\n  pedidoId: {\n    type: mongoose.Schema.Types.ObjectId, required: true\n  },\n  procesadoEn: { type: Date, default: Date.now }\n}, { timestamps: true });</code></pre>'],
["","A6 · ACCIÓN","Orden real de applyBusinessEffect",'<div class="steps"><div><b>1</b>Simular falla según <code>retryCount</code>.</div><div><b>2</b>Si <code>eventId</code> existe: devolver <code>{ duplicate: true }</code>.</div><div><b>3</b>Buscar pedido; inexistente → error permanente.</div><div><b>4</b>Crear <code>EventoProcesado</code>; código 11000 → duplicado.</div><div><b>5</b>Guardar notificación procesada; si falla, borrar el registro y lanzar error transitorio.</div></div><p class="note">Sigue sin ser una transacción distribuida; inbox/outbox son evoluciones.</p>'],
["","A7 · PRUEBA INTEGRADA","Ocho resultados que deben verse",'<table><tr><th>HTTP</th><th>Mensajería</th></tr><tr><td>1. Primera: 200 + false</td><td>6. Dos retries + éxito</td></tr><tr><td>2. Replay: 200 + true + mismo eventId</td><td>7. Agotado visible en DLQ</td></tr><tr><td>3. Stock: un descuento</td><td>8. eventId repetido: log de duplicado</td></tr><tr><td>4. Misma clave/otro pedido: REUSED</td><td></td></tr><tr><td>5. Otra clave/pedido confirmado: MISMATCH</td><td></td></tr></table>'],

["dark","CIERRE · A1–A8","Repetir sin duplicar.<br>Fallar sin perder visibilidad.",'<div class="grid"><article><h3>HTTP</h3><p>Clave estable, mismo resultado, errores accionables.</p></article><article><h3>Mensajería</h3><p>Retry con TTL y límite, DLQ observable, eventId deduplicado.</p></article></div><div class="call">No buscamos exactly once: construimos efectos idempotentes y evidencia verificable.</div>']

const speakerNotes = [
'<h3>Lectura visual</h3><p>La mitad naranja muestra una repetición que multiplica pedidos y descuentos. La mitad verde muestra una identidad estable, un retry temporizado y un único efecto.</p><h3>Idea clave</h3><p>Hoy no eliminamos las fallas: diseñamos qué ocurre cuando una operación se repite.</p><h3>Transición</h3><p>Empecemos por el caso ambiguo: recibir un 503 después de confirmar.</p>',
'<h3>Lectura visual</h3><p>Recorrer de izquierda a derecha el sistema construido en Clase 04: cliente autenticado, API que confirma y descuenta, evento en RabbitMQ y worker que procesa antes del ack.</p><h3>Recuperación</h3><p>Pedir al grupo que nombre qué evidencia vio la clase anterior: estado procesado, stock actualizado y cola vacía.</p><h3>Transición</h3><p>Ese camino feliz funciona; ahora vamos a introducir una falla sin cambiar sus componentes.</p>',
'<h3>Lectura visual</h3><p>Seguir los cuatro pasos: la API confirma, MongoDB descuenta, la respuesta se pierde y el cliente solo ve 503. El dibujo muestra que el servidor pudo completar el trabajo aunque el cliente no recibió la respuesta.</p><h3>Pregunta</h3><p>Como alumno, ¿reenviarías la solicitud? Escuchar primero. La respuesta esperada es: no todavía; antes necesito identificar la intención y consultar qué ocurrió.</p><h3>Transición</h3><p>Esta ambigüedad abre el tema de idempotencia y luego las fallas del worker.</p>',
'<h3>Lectura visual</h3><p>Leer cada fila de izquierda a derecha: componente conocido, falla posible y protección nueva. Nada aparece aislado: idempotencia protege la confirmación; retry y DLQ protegen el consumo; deduplicación protege el efecto.</p><h3>Mapa de la clase</h3><p>La práctica seguirá concepto, acción y checkpoint. No agregamos servicios: evolucionamos el flujo de Clase 04.</p><h3>Transición</h3><p>Primero elegimos una base comprobada y verificamos que el sistema anterior siga funcionando.</p>',
'<h3>Acción del alumno</h3><p>Elegir un solo camino: continuar con el código propio si la Clase 04 funciona o usar <code>clase-05-inicio</code> como base común. En ambos casos, trabajar en <code>trabajo-clase-05</code>.</p><h3>Checkpoint</h3><p>Antes de editar, comprobar que existen API, worker, integración RabbitMQ y Compose.</p>',

const slides=Array.from(document.querySelectorAll(".slide"));let current=0;
const channel="BroadcastChannel" in window?new BroadcastChannel("iaew-clase-05-presenter"):null;
function envelope(message){return Object.assign({source:"deck",sentAt:Date.now()},message)}
function send(message){const payload=envelope(message);if(channel)channel.postMessage(payload);localStorage.setItem("iaew-clase-05-presenter-message",JSON.stringify(payload))}
function state(){return {type:"state",current,total:slides.length,title:data[current][2].replace(/<[^>]*>/g,""),kicker:data[current][1],notes:speakerNotes[current]||"<p>Sin notas.</p>",nextTitle:current+1<data.length?data[current+1][2].replace(/<[^>]*>/g,""):"Fin de la clase"}}
function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,i){s.classList.toggle("active",i===current);s.setAttribute("aria-hidden",i!==current)});document.getElementById("counter").textContent=(current+1)+" / "+slides.length;history.replaceState(null,"","#D"+String(current+1).padStart(2,"0"));send(state())}
