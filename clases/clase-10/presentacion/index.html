<script>
const slides=[
  {
    "block": "0–10 min · continuidad y problema",
    "title": "La URL responde.<br>¿El negocio funciona?",
    "body": "<p class=\"subtitle\">Testing de integración, contratos y compatibilidad</p><div class=\"tag\">Integración de Aplicaciones en Entorno Web · Clase 10 · 02/11/2026</div><div class=\"detail\"><strong>La pregunta que vamos a responder</strong><span>Si el cliente repite una confirmación, ¿cómo demostramos que el stock cambia una sola vez y el resultado conserva su identidad?</span></div>",
    "notes": "El título separa dos preguntas. La clase pasada trabajamos sobre una URL accesible y una infraestructura reproducible. Hoy necesitamos demostrar que una operación respeta el contrato y deja los efectos esperados. Una pantalla verde de infraestructura no responde esa segunda pregunta.\n\nEl caso concreto será un producto de cien pesos y un pedido de una unidad. Cuando una petición se repite, queremos distinguir una nueva operación de la consulta del resultado de una operación ya completada. Al final no vamos a confiar en que la pantalla quede verde: vamos a señalar qué aserción compara cada garantía.",
    "theme": "dark"
  },
  {
    "block": "0–10 min · continuidad y problema",
    "title": "Qué evidencia recuperamos",
    "body": "<div class=\"grid\"><article><h3>Clase 10: Cloud</h3><p>Compose → imagen → ECR → ECS/Fargate → ALB.</p></article><article><h3>Pregunta al curso</h3><p>¿Qué comprobaste realmente: health, respuesta HTTP, persistencia o escalado?</p></article></div><div class=\"call\">Recuperamos resultados observados. Un ensayo previsto no equivale a un despliegue ejecutado.</div><div class=\"detail\"><strong>Disponibilidad ≠ corrección funcional</strong><span>Un balanceador puede enviar tráfico a una API que calcula mal un total. Hoy pasamos de comprobar dónde corre el sistema a verificar qué hace bajo condiciones conocidas.</span></div>",
    "notes": "La tarjeta izquierda reconstruye la secuencia de Cloud. La derecha pide evidencia concreta a los estudiantes. Si alguien no terminó AWS, usamos su respuesta local y registramos ese alcance. Un destino healthy solo muestra que pasó un chequeo de salud; no demuestra confirmación, permisos ni entrega del evento.\n\nPensemos en una API que devuelve health correcto pero resta dos unidades. El balanceador no conoce esa regla. Una prueba funcional introduce una operación y observa sus consecuencias. Recuperamos Cloud como punto de partida, pero no pedimos desplegar nuevamente ni damos por hecho que todos terminaron el ensayo remoto.",
    "theme": ""
  },
  {
    "block": "0–10 min · continuidad y problema",
    "title": "Un pedido se confirma dos veces",
    "body": "<div class=\"grid\"><article><h3>Situación</h3><p>El cliente recibe un timeout y reintenta. La API sigue saludable.</p></article><article><h3>Riesgo</h3><p>Podemos descontar stock o generar una notificación dos veces.</p></article></div><div class=\"call\">¿Qué prueba mostraría que el reintento conserva el resultado de negocio?</div><div class=\"detail\"><strong>Tres observaciones necesarias</strong><span>Stock inicial 10; una unidad confirmada deja 9. Al repetir la misma operación esperamos stock 9, mismo eventId y replayed=true. El timeout es el problema motivador; hoy probamos el reintento secuencial.</span></div>",
    "notes": "En la primera tarjeta el timeout produce incertidumbre: no sabemos si el servidor procesó el primer intento. La segunda muestra el daño posible. La respuesta esperada es reenviar la misma operación con la misma clave y observar respuesta, evento y stock. Esa hipótesis se convertirá en una prueba reproducible.\n\nEl cliente ve un timeout y no puede concluir si el servidor falló antes o después de confirmar. Esta incertidumbre explica la clave estable. Hoy no inyectamos un timeout de red: enviamos otra petición equivalente y comprobamos el comportamiento de replay. Mantener esa diferencia permite defender honestamente el alcance.",
    "theme": ""
  },
  {
    "block": "10–20 min · diseñar pruebas",
    "title": "Una prueba necesita un oráculo",
    "body": "<div class=\"grid\"><article><h3>Preparar → ejecutar</h3><p>Crear datos propios y enviar la operación bajo condiciones conocidas.</p></article><article><h3>Observar → comparar</h3><p>Comparar el resultado real con un resultado esperado explícito.</p></article></div><div class=\"call\">Un oráculo es el criterio que decide si la prueba pasó. “No dio error” es insuficiente.</div><div class=\"detail\"><strong>Ejemplo de oráculo</strong><span>Dado un producto con stock 10 y un pedido de una unidad, después de confirmar y repetir la misma clave el stock debe ser 9. Una respuesta 200 con stock 8 es un fallo de negocio.</span></div>",
    "notes": "Las tarjetas separan preparación y evaluación. Un oráculo no es otra herramienta: es la regla verificable. Para confirmar un pedido, podemos exigir estado confirmado, código 200, evento identificado y un único descuento. Antes de escribir JavaScript necesitamos acordar esas expectativas.\n\nEl oráculo surge de una regla de negocio y de precondiciones, no del resultado que nos conviene ver. Si el stock inicial fuera otro o la cantidad fuese dos, esperar nueve sería incorrecto. Esta relación entre preparación y expectativa evita aserciones que pasan por casualidad.",
    "theme": ""
  },
  {
    "block": "10–20 min · diseñar pruebas",
    "title": "Cada nivel responde otra pregunta",
    "body": "<table><tr><th>Prueba</th><th>Ejemplo</th><th>Límite</th></tr><tr><td>Unitaria</td><td>Calcular un total</td><td>No prueba DB o red</td></tr><tr><td>Integración</td><td>API ↔ MongoDB</td><td>No asegura el worker</td></tr><tr><td>Contrato</td><td>Tipos, códigos y estructura</td><td>No garantiza todo el negocio</td></tr><tr><td>Extremo a extremo</td><td>Confirmación → evento → worker</td><td>Solo escenarios ejecutados</td></tr></table>",
    "notes": "Leamos cada fila por su pregunta. Una integración puede validar dos componentes reales; una prueba de extremo a extremo atraviesa un flujo completo definido. La misma colección incluye verificaciones de contrato y de integración. No prometemos cobertura total porque una corrida fue verde.",
    "theme": ""
  },
  {
    "block": "10–20 min · diseñar pruebas",
    "title": "¿Qué queremos validar con cada prueba?",
    "body": "<table><tr><th>Tipo</th><th>Pregunta / objetivo</th></tr><tr><td>Unitaria</td><td>¿Una unidad calcula bien? Ej.: total de un pedido.</td></tr><tr><td>Integración</td><td>¿Los componentes colaboran? Ej.: API guarda y lee en MongoDB.</td></tr><tr><td>Contrato</td><td>¿La interfaz conserva lo acordado? Tipos, códigos y significado.</td></tr><tr><td>Extremo a extremo</td><td>¿El circuito produce el efecto esperado? Confirmar → worker.</td></tr><tr><td>Carga / rendimiento</td><td>¿Cumplimos el tiempo objetivo bajo una carga definida?</td></tr></table><div class=\"detail\"><strong>Nuestro objetivo de rendimiento</strong><span>Con la carga declarada: p95 de respuesta completa < 300 ms y todas las peticiones exitosas. Primero acordamos qué significa “responder bien”; después medimos.</span></div>",
    "notes": "Leamos cada fila como una pregunta de calidad. La prueba unitaria verifica una unidad; la integración observa colaboración; el contrato verifica el acuerdo que consumen otros; extremo a extremo recorre el circuito definido. Carga cambia la demanda sobre el sistema para verificar sus objetivos de rendimiento. Las categorías se pueden solapar: no son niveles de una escala única. En la demo preguntamos si estamos cumpliendo lo que necesitamos respecto del tiempo de respuesta, para una operación, carga y entorno concretos. Acordaremos p95 menor de trescientos milisegundos y todas las respuestas 200. Es un ejemplo docente; no es un SLA impuesto al TPI. Si la API devuelve errores muy rápido, no aprobó el objetivo aunque su latencia sea baja. Para tiempos aclaramos la métrica elegida: respuesta HTTP completa observada por el generador, no solamente primer byte.",
    "theme": ""
  },
  {
    "block": "10–20 min · diseñar pruebas",
    "title": "La matriz antes del código",
    "body": "<table><tr><th>Caso</th><th>Precondición</th><th>Resultado</th></tr><tr><td>Confirmar</td><td>Pendiente, stock, token</td><td>200 + confirmado</td></tr><tr><td>Repetir</td><td>Mismo pedido y clave</td><td>200 + replay</td></tr><tr><td>Conflicto</td><td>Otra clave, ya confirmado</td><td>409 + código estable</td></tr><tr><td>Token inválido</td><td>Bearer malformado</td><td>401</td></tr><tr><td>Efecto diferido</td><td>Evento publicado y worker activo</td><td>Notificación procesada</td></tr></table><div class=\"detail\"><strong>Identificar la causa del rechazo</strong><span>401: no se pudo autenticar. 403: identidad válida sin permiso. 409: conflicto con el estado actual; consultar también code. 400: entrada inválida. Un error esperado puede hacer pasar la prueba.</span></div>",
    "notes": "La columna central evita probar un conflicto sin haber confirmado antes. El código 409 por sí solo no explica qué ocurrió: verificaremos el código de aplicación. Un token inválido debe producir 401; la falta de scope sería otro caso, 403, que queda como extensión con un segundo token real.\n\nLeamos un ejemplo negativo como una prueba positiva de una regla de rechazo. Enviar un token malformado debe devolver 401: si ocurre, la prueba pasa. Para 409 necesitamos el código de aplicación porque conflictos de stock y de clave no significan lo mismo. El 403 requiere una identidad válida con menos permisos y no integra el mínimo obligatorio.",
    "theme": ""
  },
  {
    "block": "10–20 min · diseñar pruebas",
    "title": "Datos aislados y orden explícito",
    "body": "<pre>runId = identificador único por corrida\nproductoId ← POST /productos\npedidoId   ← POST /pedidos\nclave      = &quot;c10-&quot; + runId\neventId    ← POST /pedidos/:id/confirmar</pre><div class=\"call\">Crear datos nuevos en cada corrida evita depender del estado dejado por otro alumno.</div><div class=\"detail\"><strong>Estado entre peticiones</strong><span>Guardar datos con pm.collectionVariables.set y leerlos con get. El entorno contiene URL y credenciales; las variables de colección contienen IDs y claves de esta ejecución. Ejecutar desde 01 renueva runId.</span></div>",
    "notes": "Las flechas indican variables que se obtienen de respuestas reales. No copiamos IDs a mano. La clave pertenece a una operación y se conserva en sus reintentos. La colección es un escenario ordenado: ejecutar solo confirmar, sin preparar sus datos, no constituye el mismo ensayo.\n\nEl setup está resuelto, pero hay que entender sus dependencias. La respuesta al alta de producto da el identificador para el pedido; la confirmación devuelve el identificador del evento que se compara después. Si ejecutamos una petición aislada con variables de otra corrida, alteramos las precondiciones del escenario.",
    "theme": ""
  },
  {
    "block": "20–35 min · contrato y compatibilidad",
    "title": "El consumidor depende de más que la URL",
    "body": "<div class=\"grid\"><article><h3>Contrato observable</h3><p>Método, ruta, permisos, cuerpo, tipos, códigos, errores y significado de los campos.</p></article><article><h3>Ejemplo</h3><p>total: 100 es un número; total: \"100\" cambia el tipo que recibe el consumidor.</p></article></div><div class=\"call\">OpenAPI describe el contrato. Las aserciones comprueban el comportamiento observado.</div><div class=\"detail\"><strong>Qué prometemos al consumidor</strong><span>Una respuesta de confirmación contiene pedido.estado, evento.eventId e idempotencia.replayed. No son solo nombres: sus tipos y significados permiten decidir qué mostrar y cómo reintentar.</span></div>",
    "notes": "En la izquierda enumeramos decisiones que el consumidor necesita conocer. En la derecha el valor parece igual para una persona, pero puede cambiar sumas y validaciones. Tener documentación no demuestra que la implementación la cumpla. Hoy escribimos verificaciones pequeñas sobre los campos consumidos.\n\nVeamos los campos reales que consume la colección. pedido.estado expresa el resultado de negocio, evento.eventId identifica el evento e idempotencia.replayed distingue primera respuesta de recuperación. Un servidor que renombra un campo podría seguir contestando 200 y sin embargo romper al consumidor.",
    "theme": ""
  },
  {
    "block": "20–35 min · contrato y compatibilidad",
    "title": "¿Este cambio de la API rompe al cliente?",
    "body": "<p>El cliente actual suma <code>total</code> como número y muestra <code>estado</code>. ¿Qué pasa si cambiamos la respuesta?</p><table><tr><th>Antes → después</th><th>Efecto en ese cliente</th><th>Decisión</th></tr><tr><td>Sin moneda → agregar<br><code>moneda: \"ARS\"</code></td><td>Sigue funcionando si admite campos extra.</td><td>Agregar y probar compatibilidad.</td></tr><tr><td><code>total: 100</code> →<br><code>total: \"100\"</code></td><td>Ya no recibe el número que necesita para sumar.</td><td>Conservar el tipo o preparar una nueva versión.</td></tr><tr><td><code>estado</code> →<br><code>status</code></td><td>Busca estado y ya no lo encuentra.</td><td>Conservar estado durante la migración.</td></tr></table><div class=\"call\">Compatible = el cliente existente sigue funcionando sin cambiar su código.</div><div class=\"detail\"><strong>La decisión depende del consumidor</strong><span>Agregar un campo exige verificar que lo tolere. Cambiar tipos, nombres o significado puede exigir una transición; la próxima diapositiva muestra cómo organizarla.</span></div>",
    "notes": "Aquí evolución significa modificar la respuesta de una API que ya tiene clientes funcionando. No son tres etapas sucesivas: son tres cambios alternativos que debemos evaluar antes de publicar. Tomemos un cliente concreto: lee total como número para calcular y muestra el campo estado.\n\nPrimera fila: agregamos moneda con el valor ARS sin quitar ni modificar los campos anteriores. Si el cliente ignora los campos nuevos, sigue funcionando. La decisión es agregar el campo y comprobarlo con las pruebas del consumidor; si su validador rechaza campos extra, debemos acordar la adaptación antes de publicar.\n\nSegunda fila: total era el número 100 y ahora es el texto \"100\". Aunque se vean parecidos, una operación puede concatenar texto en vez de sumar o rechazar el valor. La decisión es conservar el tipo numérico en el contrato actual. Si necesitamos cambiarlo, preparar un contrato nuevo y una migración.\n\nTercera fila: renombramos estado como status. El cliente sigue buscando estado y no lo encuentra, aunque el servidor responda 200. La decisión es mantener el campo anterior durante la transición y retirarlo solo según la migración acordada.\n\nLa pregunta común es: ¿el cliente que ya funciona puede seguir usando esta respuesta sin modificar su código? También debemos conservar el significado: pasar de pesos a centavos rompe los cálculos aunque total siga siendo numérico. Agregar un valor a un enum puede romper un cliente que solo contempla los valores anteriores. La siguiente diapositiva explica cómo mantener una transición cuando la ruptura es necesaria.",
    "theme": ""
  },
  {
    "block": "20–35 min · contrato y compatibilidad",
    "title": "Versionar implica mantener una transición",
    "body": "<div class=\"grid\"><article><h3>Compatible</h3><p>Conservar campos y significado; añadir capacidad documentada y probada.</p></article><article><h3>Ruptura necesaria</h3><p>Nueva versión, período de convivencia, migración y retiro comunicado.</p></article></div><div class=\"call\">Cambiar /v1 por /v2 sin estrategia de migración no resuelve la compatibilidad.</div><div class=\"detail\"><strong>Ejemplo de transición</strong><span>Si total debe cambiar de formato, conservar temporalmente el contrato anterior y publicar el nuevo de forma explícita. Documentar diferencias, probar ambos consumidores y comunicar el retiro de la versión anterior.</span></div>",
    "notes": "Las dos tarjetas muestran rutas posibles. Una versión identifica un contrato distinto; no corrige por sí misma a los clientes existentes. En este ejercicio no implementamos una API v2: detectamos una ruptura y escribimos qué transición haríamos. Así evitamos sumar desarrollo ajeno al objetivo de pruebas.\n\nLa transición necesita responsables y fechas acordadas, además de endpoints. Podemos probar el consumidor anterior mientras se desarrolla el nuevo. Este ejemplo sirve para explicar una decisión de diseño, no para agregar una implementación v2 a la práctica. Cada equipo propondrá su estrategia con su dominio.",
    "theme": ""
  },
  {
    "block": "20–35 min · contrato y compatibilidad",
    "title": "El contrato se vuelve una aserción",
    "body": "<pre>// Extracto ilustrativo de una confirmación:\n// { pedido: { estado: &quot;confirmado&quot; }, evento: { eventId: &quot;...&quot; } }\nconst b = pm.response.json();\npm.test(&quot;Pedido confirmado&quot;, () =&gt; {\n  pm.expect(b.pedido.estado).to.eql(&quot;confirmado&quot;);\n});\nconst tipo = pm.response.headers.get(&quot;Content-Type&quot;);\npm.test(&quot;Respuesta JSON&quot;, () =&gt; pm.expect(tipo).to.include(&quot;application/json&quot;));</pre><div class=\"detail\"><strong>Qué compara cada línea</strong><span>Cuerpo → objeto b → campo estado → igualdad. Header → texto tipo → contiene application/json. Una prueba de tipo usa to.be.a(\"number\").</span></div>",
