    "body": "<p class=\"subtitle\">Testing de integración, contratos y compatibilidad</p><div class=\"tag\">Integración de Aplicaciones en Entorno Web · Clase 10 · 02/11/2026</div>",

  {

    "body": "<div class=\"grid\"><article><h3>Clase 10: Cloud</h3><p>Compose → imagen → ECR → ECS/Fargate → ALB.</p></article><article><h3>Pregunta al curso</h3><p>¿Qué comprobaste realmente: health, respuesta HTTP, persistencia o escalado?</p></article></div><div class=\"call\">Recuperamos resultados observados. Un ensayo previsto no equivale a un despliegue ejecutado.</div>",

    "theme": ""
  },
  {
    "block": "0–10 min · continuidad y problema",
    "title": "Un pedido se confirma dos veces",
    "body": "<div class=\"grid\"><article><h3>Situación</h3><p>El cliente recibe un timeout y reintenta. La API sigue saludable.</p></article><article><h3>Riesgo</h3><p>Podemos descontar stock o generar una notificación dos veces.</p></article></div><div class=\"call\">¿Qué prueba mostraría que el reintento conserva el resultado de negocio?</div>",
    "notes": "En la primera tarjeta el timeout produce incertidumbre: no sabemos si el servidor procesó el primer intento. La segunda muestra el daño posible. La respuesta esperada es reenviar la misma operación con la misma clave y observar respuesta, evento y stock. Esa hipótesis se convertirá en una prueba reproducible.",
    "theme": ""
  },
  {
    "block": "0–10 min · continuidad y problema",
    "title": "Volvemos al circuito integrado",
    "body": "<div class=\"flow\"><b>Postman / Newman</b><i>→</i><b>API</b><i>→</i><b>MongoDB</b></div><div class=\"flow\"><b>API confirma</b><i>→</i><b>RabbitMQ</b><i>→</i><b>Worker</b><i>→</i><b>MongoDB</b></div><div class=\"call\">Usamos el laboratorio de Clase 07. La API simplificada de Cloud no incluye Auth0 ni este flujo.</div>",
    "notes": "Las dos filas muestran HTTP y el efecto diferido. Newman envía las mismas peticiones de una colección Postman desde la terminal. El broker transporta el evento y el worker actualiza la notificación. Retomamos un recurso conocido porque contiene las reglas que queremos probar; no suponemos que la API de Cloud ya las tenía.",
    "theme": ""
  },
  {
    "block": "0–10 min · continuidad y problema",
    "title": "Qué entregaremos hoy",
    "body": "<div class=\"grid\"><article><h3>Artefacto individual</h3><p>Colección con aserciones, reporte sin secretos y explicación de una incompatibilidad.</p></article><article><h3>Resultado verificable</h3><p>Confirmación, replay, conflicto, token inválido, stock y worker.</p></article></div><div class=\"call\">120 min: apertura 10 · matriz 15 · contratos 15 · demo 15 · práctica 45 · carga 10 · cierre 10.</div>",
    "notes": "Las tarjetas definen el producto y el criterio de éxito. Las credenciales y el entorno se preparan antes de clase; los 45 minutos son para probar y completar aserciones. El TPI sigue siendo grupal: cada estudiante aprende la técnica y luego el equipo adapta la evidencia.",
    "theme": ""
  },
  {
    "block": "10–25 min · diseñar pruebas",
    "title": "Una prueba necesita un oráculo",
    "body": "<div class=\"grid\"><article><h3>Preparar → ejecutar</h3><p>Crear datos propios y enviar la operación bajo condiciones conocidas.</p></article><article><h3>Observar → comparar</h3><p>Comparar el resultado real con un resultado esperado explícito.</p></article></div><div class=\"call\">Un oráculo es el criterio que decide si la prueba pasó. “No dio error” es insuficiente.</div>",
    "notes": "Las tarjetas separan preparación y evaluación. Un oráculo no es otra herramienta: es la regla verificable. Para confirmar un pedido, podemos exigir estado confirmado, código 200, evento identificado y un único descuento. Antes de escribir JavaScript necesitamos acordar esas expectativas.",
    "theme": ""
  },
  {
    "block": "10–25 min · diseñar pruebas",
    "title": "Cada nivel responde otra pregunta",
    "body": "<table><tr><th>Prueba</th><th>Ejemplo</th><th>Límite</th></tr><tr><td>Unitaria</td><td>Calcular un total</td><td>No prueba DB o red</td></tr><tr><td>Integración</td><td>API ↔ MongoDB</td><td>No asegura el worker</td></tr><tr><td>Contrato</td><td>Tipos, códigos y estructura</td><td>No garantiza todo el negocio</td></tr><tr><td>Extremo a extremo</td><td>Confirmación → evento → worker</td><td>Solo escenarios ejecutados</td></tr></table>",
    "notes": "Leamos cada fila por su pregunta. Una integración puede validar dos componentes reales; una prueba de extremo a extremo atraviesa un flujo completo definido. La misma colección incluye verificaciones de contrato y de integración. No prometemos cobertura total porque una corrida fue verde.",
    "theme": ""
  },
  {
    "block": "10–25 min · diseñar pruebas",
    "title": "La matriz antes del código",
    "body": "<table><tr><th>Caso</th><th>Precondición</th><th>Resultado</th></tr><tr><td>Confirmar</td><td>Pendiente, stock, token</td><td>200 + confirmado</td></tr><tr><td>Repetir</td><td>Mismo pedido y clave</td><td>200 + replay</td></tr><tr><td>Conflicto</td><td>Otra clave, ya confirmado</td><td>409 + código estable</td></tr><tr><td>Token inválido</td><td>Bearer malformado</td><td>401</td></tr><tr><td>Efecto diferido</td><td>Evento publicado y worker activo</td><td>Notificación procesada</td></tr></table>",
    "notes": "La columna central evita probar un conflicto sin haber confirmado antes. El código 409 por sí solo no explica qué ocurrió: verificaremos el código de aplicación. Un token inválido debe producir 401; la falta de scope sería otro caso, 403, que queda como extensión con un segundo token real.",
    "theme": ""
  },
  {
    "block": "10–25 min · diseñar pruebas",
    "title": "Datos aislados y orden explícito",
    "body": "<pre>runId = identificador único por corrida\nproductoId ← POST /productos\npedidoId   ← POST /pedidos\nclave      = &quot;c10-&quot; + runId\neventId    ← POST /pedidos/:id/confirmar</pre><div class=\"call\">Crear datos nuevos en cada corrida evita depender del estado dejado por otro alumno.</div>",
    "notes": "Las flechas indican variables que se obtienen de respuestas reales. No copiamos IDs a mano. La clave pertenece a una operación y se conserva en sus reintentos. La colección es un escenario ordenado: ejecutar solo confirmar, sin preparar sus datos, no constituye el mismo ensayo.",
    "theme": ""
  },
  {
    "block": "25–40 min · contrato y compatibilidad",
    "title": "El consumidor depende de más que la URL",
    "body": "<div class=\"grid\"><article><h3>Contrato observable</h3><p>Método, ruta, permisos, cuerpo, tipos, códigos, errores y significado de los campos.</p></article><article><h3>Ejemplo</h3><p>total: 100 es un número; total: \"100\" cambia el tipo que recibe el consumidor.</p></article></div><div class=\"call\">OpenAPI describe el contrato. Las aserciones comprueban el comportamiento observado.</div>",
    "notes": "En la izquierda enumeramos decisiones que el consumidor necesita conocer. En la derecha el valor parece igual para una persona, pero puede cambiar sumas y validaciones. Tener documentación no demuestra que la implementación la cumpla. Hoy escribimos verificaciones pequeñas sobre los campos consumidos.",
    "theme": ""
  },
  {
    "block": "25–40 min · contrato y compatibilidad",
    "title": "Tres evoluciones, tres decisiones",
    "body": "<table><tr><th>Cambio</th><th>Evaluación</th></tr><tr><td>Agregar moneda opcional</td><td>Usualmente compatible si el consumidor tolera campos extra</td></tr><tr><td>total: number → string</td><td>Rompe al consumidor que requiere un número</td></tr><tr><td>Eliminar estado o renombrarlo</td><td>Rompe al consumidor que lo utiliza</td></tr></table><div class=\"call\">Agregar un valor a un enum también puede romper consumidores exhaustivos.</div>",
    "notes": "La compatibilidad depende del contrato y del consumidor. No afirmamos que todo campo nuevo sea seguro: un cliente que rechaza propiedades adicionales podría fallar. Un enum nuevo puede romper un switch exhaustivo. Justificamos la decisión con el consumidor que realmente tenemos.",
    "theme": ""
  },
  {
    "block": "25–40 min · contrato y compatibilidad",
    "title": "Versionar implica mantener una transición",
    "body": "<div class=\"grid\"><article><h3>Compatible</h3><p>Conservar campos y significado; añadir capacidad documentada y probada.</p></article><article><h3>Ruptura necesaria</h3><p>Nueva versión, período de convivencia, migración y retiro comunicado.</p></article></div><div class=\"call\">Cambiar /v1 por /v2 sin estrategia de migración no resuelve la compatibilidad.</div>",
    "notes": "Las dos tarjetas muestran rutas posibles. Una versión identifica un contrato distinto; no corrige por sí misma a los clientes existentes. En este ejercicio no implementamos una API v2: detectamos una ruptura y escribimos qué transición haríamos. Así evitamos sumar desarrollo ajeno al objetivo de pruebas.",
    "theme": ""

  {
    "block": "25–40 min · contrato y compatibilidad",
    "title": "El contrato se vuelve una aserción",
    "body": "<pre>pm.test(&quot;El total sigue siendo numérico&quot;, () =&gt; {\n  pm.expect(pm.response.json().total).to.be.a(&quot;number&quot;);\n});</pre><div class=\"call\">Una prueba útil debe fallar ante la regresión que dice detectar.</div>",
    "notes": "El bloque registra una prueba con nombre y compara el tipo real. pm es la API del entorno de scripts de Postman. pm.test organiza el caso y pm.expect expresa la expectativa. Después ejecutaremos un ejemplo con fixtures que agrega un campo y cambia un tipo; el alcance de ese ejemplo es el contrato, no la red.",
    "theme": ""
  },
  {
    "block": "40–55 min · demo guiada",
    "title": "Postman y Newman ejecutan la misma colección",
    "body": "<div class=\"grid\"><article><h3>Postman</h3><p>Importar colección v2.1 y entorno. Editar Scripts → Post-response.</p></article><article><h3>Newman</h3><p>Ejecutar desde terminal con dependencias y producir un resultado repetible.</p></article></div><div class=\"call\">El token Bearer se obtiene antes. Newman no ejecuta el asistente OAuth de la interfaz.</div>",
    "notes": "La interfaz facilita explorar y escribir las aserciones; el runner permite repetirlas. Mantenemos v2.1 por compatibilidad con Newman y con el calendario del curso. Las credenciales se guardan en un entorno local excluido de Git. No exportamos el entorno privado como parte de la entrega.",
    "theme": ""
  },
  {
    "block": "40–55 min · demo guiada",
    "title": "Variables que no se mezclan",
    "body": "<table><tr><th>Variable</th><th>Origen y uso</th></tr><tr><td>baseUrl</td><td>http://localhost:3008 · laboratorio Clase 07</td></tr><tr><td>accessToken</td><td>Auth0 · read/write/confirm:pedidos</td></tr><tr><td>apiKey</td><td>INTERNAL_API_KEY · alta de productos</td></tr><tr><td>productoId / pedidoId</td><td>Respuestas de esta corrida</td></tr></table><div class=\"call\">La API key de productos no reemplaza al access token de pedidos.</div>",
    "notes": "Cada fila tiene una responsabilidad distinta. El token requiere los scopes read:pedidos, write:pedidos y confirm:pedidos, con audience https://iaew-pedidos-api. La tabla usa una abreviación visual de los scopes; la guía los da literales. Pedir al curso que identifique qué credencial viaja en cada petición.",
    "theme": ""
  },
  {
    "block": "40–55 min · demo guiada",
    "title": "Reintentar no debe repetir el efecto",
    "body": "<pre>POST /pedidos/:id/confirmar\nIdempotency-Key: c10-&lt;runId&gt;\n\nPrimer intento: 200, replayed=false\nMisma clave:    200, replayed=true, mismo eventId\nOtra clave:    409, IDEMPOTENCY_KEY_MISMATCH</pre><div class=\"call\">Comprobar también stock: 10 → 9 → 9. El estado HTTP solo no alcanza.</div>",
    "notes": "El bloque presenta tres caminos sobre el mismo pedido. La clave no es un token de autenticación; identifica la operación. La aserción sobre el evento y la lectura de stock permiten detectar parte de los efectos duplicados. Esta prueba es secuencial y no acredita atomicidad frente a dos confirmaciones concurrentes.",
    "theme": ""
  },
  {
    "block": "40–55 min · demo guiada",
    "title": "El worker termina después de la respuesta",
    "body": "<pre>GET /pedidos\nBuscar pedidoId de esta corrida\n¿notificacionEstado === &quot;procesada&quot;?\n  sí → aserción exitosa\n  no → repetir, hasta 10 consultas</pre><div class=\"call\">La colección espera 500 ms entre requests. No usa una espera infinita ni exige efecto inmediato.</div>",
    "notes": "El bloque describe polling: consultar hasta que una condición sea observable o se alcance un límite. Si el worker está detenido, la confirmación puede responder 200 y esta aserción debe fallar. Tener broker disponible no equivale a tener el efecto procesado. La ventana es didáctica, no un SLA de producción.",
    "theme": ""
  },
  {
    "block": "40–55 min · demo guiada",
    "title": "Demo: ejecutar y leer el fallo",
    "body": "<pre>cd recursos\nnpm ci\n# Completar entorno.local.json y coleccion-alumno.json\nnpm run pruebas\n# Código de salida 0: sin fallos en este escenario\n# Código de salida 1: revisar caso y precondiciones</pre><div class=\"call\">El runner escribe evidencias/resumen.json sin headers, cuerpos ni credenciales.</div>",
    "notes": "Mostrar dónde se ve el nombre de cada aserción. Un error de conexión es un fallo de entorno; un 409 inesperado exige revisar datos y claves; una aserción de tipo fallida puede revelar una ruptura. El reporte es acotado para evitar exportar tokens. No usar opciones que oculten el código de salida.",
    "theme": ""
  },
  {
    "block": "55–100 min · práctica individual",
    "title": "A y B · preparar y completar (20 min)",
    "body": "<div class=\"grid\"><article><h3>A · 5 minutos</h3><p>Copiar base y entorno. Confirmar URL, credenciales y matriz de resultados.</p></article><article><h3>B · 15 minutos</h3><p>Completar TODO_REPLAY, TODO_CONFLICTO y TODO_CONTRATO; conservar setup y polling.</p></article></div><div class=\"call\">Primera corrida: los TODO deben fallar. No se evalúa por cantidad de requests.</div>",
    "notes": "A presupone laboratorio y herramientas preparados. B concentra el trabajo intelectual en tres conjuntos de aserciones: identidad del evento, conflicto y estructura más stock. La guía indica qué editar y qué observar. El runner impide presentar una colección que todavía conserva marcadores pendientes.",
    "theme": ""
  },
  {
    "block": "55–100 min · práctica individual",
    "title": "C y D · comprobar el poder de la prueba",
    "body": "<div class=\"grid\"><article><h3>C · 10 minutos</h3><p>Ejecutar dos corridas limpias. Cambiar stock esperado 9 → 8 y comprobar salida 1; restaurar 9.</p></article><article><h3>D · 10 minutos</h3><p>Ejecutar compatibilidad.cjs y explicar por qué cambiar un tipo rompe al consumidor.</p></article></div><div class=\"call\">Un fallo deliberado acredita sensibilidad de la aserción, no una regresión real de la API.</div>",
    "notes": "La tarjeta C pide una mutación de la expectativa, no del backend. Debe aparecer el caso de stock como fallido y después recuperarse. D utiliza datos de ejemplo sin servicios externos: hay que etiquetar esa evidencia como fixture. Los dos ejercicios enseñan a interpretar qué demuestra cada prueba.",

    "notes": "Las tarjetas distinguen repetición de concurrencia. Para el TPI el equipo define una hipótesis y elige una herramienta admitida. El objetivo no es hacer caer el servicio, sino medir comportamiento con una carga declarada. No presentamos Newman como generador de usuarios simultáneos.",

const deck=document.querySelector("#deck");let current=0;const presenterChannel="BroadcastChannel"in window?new BroadcastChannel("iaew-clase-10-presenter"):null;
function render(){deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme||""} ${i===current?"active":""}" aria-label="Diapositiva ${i+1}"><p class="kicker">${s.block}</p><h2>${s.title}</h2><div class="slide-content">${s.body}</div><div class="footer"><span>IAEW 2026 · Clase 10 · Testing de integración y contratos</span><span class="slide-no">${i+1} / ${slides.length}</span></div></section>`).join("");document.querySelector("#counter").textContent=`${current+1} / ${slides.length}`;document.querySelector("#progress").style.width=`${(current+1)/slides.length*100}%`;publish()}
function publish(){const s=slides[current],message={source:"deck",type:"state",current,total:slides.length,kicker:s.block,title:s.title.replace(/<br\s*\/?>/gi," "),notes:s.notes,nextTitle:slides[current+1]?.title.replace(/<br\s*\/?>/gi," ")||"Fin",sentAt:Date.now()};if(presenterChannel)presenterChannel.postMessage(message);try{localStorage.setItem("iaew-clase-10-presenter-state",JSON.stringify(message))}catch{}}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}
document.querySelector("#prev").onclick=()=>go(current-1);document.querySelector("#next").onclick=()=>go(current+1);document.querySelector("#presenter").onclick=()=>window.open("presenter.html","iaew-clase-10-presenter","width=1100,height=820");document.querySelector("#fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(current+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(current-1)}if(e.key.toLowerCase()==="p")window.open("presenter.html","iaew-clase-10-presenter","width=1100,height=820");if(e.key.toLowerCase()==="f")document.querySelector("#fullscreen").click()});
addEventListener("storage",e=>{if(e.key==="iaew-clase-10-presenter-message"&&e.newValue){const msg=JSON.parse(e.newValue);if(msg.type==="navigate")go(msg.index)}});if(presenterChannel)presenterChannel.onmessage=e=>{if(e.data?.source==="presenter"&&e.data.type==="navigate")go(e.data.index);if(e.data?.source==="presenter"&&e.data.type==="state-request")publish()}
function resizeDeck(){document.documentElement.style.setProperty('--scale',Math.min((innerWidth-70)/1280,(innerHeight-80)/720))}addEventListener('resize',resizeDeck);resizeDeck();
render();
</script></body></html>
