e{background:#16374b;border-color:#375467}.call{background:#daf0e9;border-left:5px solid #28a978;padding:13px 18px;font-size:18px;line-height:1.38}.dark .call{background:#18453f}pre{white-space:pre-wrap;background:#111e2d;color:#e5f8ff;border-radius:12px;padding:16px 22px;font-size:17px;line-height:1.32;margin:0 0 12px}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;margin-bottom:12px}th{text-align:left;background:#d9e8ef}th,td{padding:9px 12px;border-bottom:1px solid #c9d8e2}.flow{display:flex;align-items:center;gap:10px;margin-bottom:20px}.flow b{flex:1;background:#dfebf1;border:1px solid #bed2dc;padding:18px 8px;border-radius:10px;text-align:center;font-size:18px}.flow i{font-style:normal;color:#008eaa;font-size:24px}.steps{display:grid;gap:10px}.steps div{padding:12px 16px;background:#e6eef3;border-radius:9px;font-size:18px}.steps b{color:#007b95;margin-right:12px}.tag{display:inline-block;border:1px solid #4c726e;color:#8ce7d3;padding:10px 14px;border-radius:6px;margin-top:12px;font-size:14px;letter-spacing:.05em}.footer{position:absolute;z-index:3;left:80px;right:80px;bottom:22px;display:flex;align-items:center;gap:15px;font-size:12px;color:#627484}.footer img{height:29px;max-width:130px;object-fit:contain;margin-left:auto}.dark .footer{color:#abc5d7}.nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;color:#ddeaf3;font-size:13px}button{border:1px solid #446076;background:#143247;color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer}@media print{@page{size:1280px 720px;margin:0}html,body{height:auto;overflow:visible;background:white}.deck{display:block;padding:0}.slide,.slide.active{position:relative;display:flex;transform:none;break-after:page;border-radius:0;box-shadow:none}.nav{display:none}}

<script>
const data=[
["dark","CLASE 06 · DOCUMENTACIÓN VIVA","Si otro equipo no puede integrarse,<br>el sistema no está terminado",'<p class="subtitle">OpenAPI, JSON Schema y EventCatalog sobre la API resiliente de pedidos.</p><div class="tag">ACTIVIDAD INDIVIDUAL · 120 MINUTOS · A1–A4</div>'],
["","CONTINUIDAD · CLASE 05","¿Qué dejamos funcionando?",'<div class="flow"><b>Cliente<br><code>Idempotency-Key</code></b><i>›</i><b>API<br>un solo efecto</b><i>›</i><b>RabbitMQ<br>retry + DLQ</b><i>›</i><b>Worker<br>deduplicación</b></div><div class="call">Evidencia: mismo <code>eventId</code> en replay, stock descontado una vez y mensajes agotados visibles en DLQ.</div>'],
["","PROBLEMA · EL CÓDIGO FUNCIONA","Otro equipo pregunta cómo integrarse",'<div class="grid three"><article><h3>HTTP</h3><p>¿Ruta, encabezado, permisos y errores?</p></article><article><h3>Arquitectura</h3><p>¿Qué componente hace qué?</p></article><article><h3>Evento</h3><p>¿Campos, versión y garantía?</p></article></div><div class="call">Leer el código completo no es un contrato de integración.</div>'],
["","PREGUNTA ABIERTA","¿Qué debe saber un consumidor sin leer nuestra implementación?",'<table><tr><th>Falta</th><th>Artefacto</th></tr><tr><td>Contrato HTTP ejecutable</td><td><b>OpenAPI + Swagger UI</b></td></tr><tr><td>Límites y responsabilidades</td><td><b>C4</b></td></tr><tr><td>Razón de una decisión</td><td><b>ADR</b></td></tr><tr><td>Mensaje entre servicios</td><td><b>JSON Schema / catálogo</b></td></tr></table>'],
["","OBJETIVO Y RUTA","Convertir comportamiento real en documentación verificable",'<div class="steps"><div><b>0–30</b>Problema, OpenAPI y Swagger UI</div><div><b>30–60</b>Práctica HTTP</div><div><b>60–80</b>Plantillas TPI y contrato de evento</div><div><b>80–110</b>EventCatalog y demo de Backstage</div><div><b>110–120</b>IA, evidencia y TPI</div></div>'],
["","CONCEPTO","Cada recurso responde una pregunta",'<div class="grid"><article><h3>OpenAPI</h3><p>¿Cómo invoco y qué recibo?</p></article><article><h3>JSON Schema</h3><p>¿Qué forma tiene el evento?</p></article><article><h3>EventCatalog</h3><p>¿Quién produce y consume?</p></article><article><h3>Backstage</h3><p>¿Qué software y APIs existen?</p></article></div>'],
["","PROBLEMA · CONTRATO HTTP","La operación existe, pero cada consumidor la interpreta distinto",'<div class="grid"><article><h3>Riesgo</h3><p>Encabezado, permiso o respuesta incorrectos.</p></article><article><h3>Consecuencia</h3><p>Integraciones frágiles y reintentos peligrosos.</p></article></div><div class="call">Necesitamos una fuente consultable por personas y herramientas.</div>'],
["","OPENAPI 3.1","Un lenguaje común para describir APIs HTTP",'<div class="grid three"><article><h3>Concepto</h3><p>Contrato estándar legible por personas y herramientas.</p></article><article><h3>Origen</h3><p>Nació como Swagger; en 2015 pasó a la OpenAPI Initiative.</p></article><article><h3>Problema</h3><p>Evita que cada consumidor deduzca rutas, datos y errores desde el código.</p></article></div><pre><code>"openapi": "3.1.0" · "/pedidos/{id}/confirmar" · POST</code></pre><div class="call">Express usa <code>:id</code>; OpenAPI usa <code>{id}</code>.</div>'],
["","CONTRATO REAL","No documentar solo el 200",'<table><tr><th>Estado</th><th>Qué debe decidir el consumidor</th></tr><tr><td>200</td><td>Confirmación o repetición según encabezado</td></tr><tr><td>400</td><td>Corregir entrada o clave</td></tr><tr><td>401 / 403</td><td>Obtener token o permiso</td></tr><tr><td>404 / 409</td><td>Revisar entidad, estado o conflicto</td></tr><tr><td>503</td><td>Consultar estado antes de repetir</td></tr></table>'],
["","SEGURIDAD","El permiso también forma parte del contrato",'<pre><code>"security": [{ "oauth2": ["confirm:pedidos"] }]\n\n"clientCredentials": {\n  "tokenUrl": "https://TU_AUTH0_DOMAIN/oauth/token",\n  "scopes": { "confirm:pedidos": "Confirmar pedidos" }\n}</code></pre><div class="call">Audience: <code>https://iaew-pedidos-api</code>. No mezclar OAuth con <code>x-api-key</code>.</div>'],
["","PROBLEMA · DESCUBRIMIENTO","Un contrato correcto que nadie encuentra sigue siendo un problema",'<div class="grid"><article><h3>Archivo aislado</h3><p>Cuesta explorar y probar.</p></article><article><h3>Copia separada</h3><p>Puede quedar desactualizada.</p></article></div><div class="call">La interfaz debe mostrar el mismo OpenAPI versionado.</div>'],
["","SWAGGER UI","Volver navegable un contrato OpenAPI",'<div class="grid three"><article><h3>Concepto</h3><p>Interfaz interactiva generada desde OpenAPI.</p></article><article><h3>Origen</h3><p>Nació dentro del ecosistema Swagger para visualizar y probar APIs.</p></article><article><h3>Problema</h3><p>Un archivo correcto puede ser difícil de descubrir y explorar.</p></article></div><pre><code>GET /api-docs/\nGET /api-docs/openapi.json</code></pre><div class="call">La interfaz muestra el contrato; no demuestra que código y contrato coincidan.</div>'],
["","A1 · CHECKPOINT","Partir de una base conocida",'<pre><code>git fetch origin\ngit switch clase-06-inicio\ngit switch -c trabajo-clase-06\nnpm ci\nnpm test\nnpm run check</code></pre><div class="call">La base contiene Clase 05 resuelta y recursos preparados; los cuatro resultados obligatorios no están resueltos.</div>'],
["","A2 · ACCIÓN","Escribir el contrato central",'<div class="grid"><article><h3>Ruta</h3><p><code>POST /pedidos/{id}/confirmar</code></p></article><article><h3>Encabezado</h3><p><code>Idempotency-Key</code>, requerido</p></article><article><h3>Permiso</h3><p><code>confirm:pedidos</code></p></article><article><h3>Resultados</h3><p>200, 400, 401, 403, 404, 409, 503</p></article></div>'],
["","A2 · CHECKPOINT","Publicar y comprobar dos recursos",'<pre><code>curl -i http://localhost:3000/api-docs/\ncurl -s http://localhost:3000/api-docs/openapi.json</code></pre><div class="grid"><article><h3>Interfaz</h3><p>Swagger UI responde 200.</p></article><article><h3>Contrato</h3><p>El JSON publicado informa OpenAPI 3.1.0.</p></article></div>'],
["","AUTODOCUMENTACIÓN","¿NestJS o Fastify pueden generar OpenAPI?",'<div class="grid"><article><h3>NestJS</h3><p>DTOs y decoradores alimentan <code>@nestjs/swagger</code>.</p></article><article><h3>Fastify</h3><p>JSON Schema de las rutas alimenta <code>@fastify/swagger</code>.</p></article></div><div class="call"><b>Ventaja:</b> validación, tipos y documentación comparten una fuente; disminuyen duplicación y desactualización.</div><p><b>Límite:</b> ejemplos, errores, scopes, idempotencia y semántica todavía necesitan revisión humana.</p>'],
["","PROBLEMA · RESPONSABILIDADES","El contrato no muestra dónde ocurre cada cosa",'<div class="grid"><article><h3>Pregunta</h3><p>¿API, base, broker o worker?</p></article><article><h3>Si falta la vista</h3><p>Los límites y puntos de falla quedan implícitos.</p></article></div><div class="call">Necesitamos un mapa con el nivel de zoom adecuado.</div>'],
["","RECURSO TPI · C4 MODEL","Escribir arquitectura con un vocabulario común",'<div class="grid three"><article><h3>Concepto</h3><p>Modelo jerárquico de sistemas, contenedores, componentes y código.</p></article><article><h3>Origen</h3><p>Simon Brown lo formalizó entre 2006 y 2011 a partir de talleres de arquitectura.</p></article><article><h3>Problema</h3><p>Diagramas ambiguos, con niveles mezclados y sin significado compartido.</p></article></div><div class="call">Es independiente de la herramienta y de la notación gráfica.</div>'],
["","PLANTILLA TPI · C4","La arquitectura se puede leer como una oración",'<div class="flow"><b>API Express</b><i>publica</i><b>RabbitMQ</b><i>entrega</i><b>Worker</b></div><div class="call"><b>Origen</b> se relaciona con <b>destino</b> para un <b>propósito</b> mediante una <b>tecnología o protocolo</b>.</div><p>La vista se versiona junto con el código y usa sus mismos nombres.</p>'],
["","TPI · CONTEXT / CONTAINER / COMPONENT","Tres vistas, tres preguntas",'<div class="grid three"><article><h3>Context</h3><p>¿Quién usa el sistema y con qué sistemas se integra?</p></article><article><h3>Container</h3><p>¿Dónde se ejecuta o almacena cada responsabilidad?</p></article><article><h3>Component</h3><p>¿Cómo se divide un contenedor relevante?</p></article></div><div class="call">Los nombres deben coincidir con código, contratos, eventos y README.</div>'],
["","PROBLEMA · DECISIONES","El código conserva qué hicimos, pero no por qué",'<div class="grid"><article><h3>Con el tiempo</h3><p>El contexto original se pierde.</p></article><article><h3>Consecuencia</h3><p>Una decisión puede revertirse sin conocer sus costos.</p></article></div><div class="call">Necesitamos conservar contexto, decisión y consecuencias.</div>'],
["","RECURSO TPI · ADR","Conservar por qué se tomó una decisión",'<div class="grid three"><article><h3>Concepto</h3><p>Registro breve de contexto, decisión, estado y consecuencias.</p></article><article><h3>Origen</h3><p>Michael Nygard propuso este formato liviano en 2011.</p></article><article><h3>Problema</h3><p>El código muestra qué quedó hecho, pero pierde motivaciones y costos.</p></article></div><div class="call">Una decisión reemplazada se conserva como parte de la historia.</div>'],
["","PLANTILLA TPI · ADR","ADR 0001: identidad de confirmación",'<pre><code># ADR 0001 — Identificar cada confirmación\n- Estado: aceptada\n\n## Contexto\n## Decisión\n## Consecuencias\n## Alternativas descartadas</code></pre><div class="call">Una decisión futura reemplaza el ADR; no borra su historia.</div>'],
["","PROBLEMA · MENSAJE","El nombre del evento no alcanza como contrato",'<div class="grid"><article><h3>Falta</h3><p>Campos, tipos, obligatoriedad y versión.</p></article><article><h3>Consecuencia</h3><p>El productor puede romper al consumidor sin advertirlo.</p></article></div><div class="call">Necesitamos validar la forma del mensaje.</div>'],
["","JSON SCHEMA","Un contrato para la forma de los datos",'<div class="grid three"><article><h3>Concepto</h3><p>Vocabulario JSON para describir y validar documentos JSON.</p></article><article><h3>Origen</h3><p>La primera propuesta fue publicada por Kris Zyp en 2007.</p></article><article><h3>Problema</h3><p>Un nombre de evento no define campos, tipos ni obligatoriedad.</p></article></div><pre><code>"type": "pedido.confirmado" · "version": 1 · "pedidoId": "string"</code></pre>'],
["","A3 · SEMÁNTICA","El esquema no cuenta toda la historia",'<div class="grid"><article><h3>Productor</h3><p>API Pedidos</p></article><article><h3>Consumidor</h3><p>Worker de notificaciones</p></article><article><h3>Entrega</h3><p>Al menos una vez</p></article><article><h3>Deduplicación</h3><p><code>eventId</code></p></article></div>'],
["","PROBLEMA · IMPACTO","Tenemos el esquema, pero no sabemos quién depende de él",'<div class="grid"><article><h3>Archivo aislado</h3><p>No muestra productor ni consumidores.</p></article><article><h3>Cambio</h3><p>Puede afectar a otro equipo sin identificarlo.</p></article></div><div class="call">Necesitamos conectar servicios, mensaje y versión.</div>'],
["","A4 · EVENTCATALOG","Del archivo aislado al mapa navegable",'<div class="grid three"><article><h3>Concepto</h3><p>Catálogo de arquitectura para servicios, APIs y eventos.</p></article><article><h3>Origen</h3><p>Surgió como documentación viva para arquitecturas distribuidas orientadas a eventos.</p></article><article><h3>Problema</h3><p>Un esquema aislado no revela productores, consumidores ni impacto.</p></article></div><div class="call"><code>PedidosAPI</code> → <code>PedidoConfirmado</code> → <code>WorkerNotificaciones</code></div>'],
["","A4 · PUNTO DE CONTROL","Tres recursos conectados por identidad y versión",'<pre><code>services/PedidosAPI/index.mdx\n  sends: PedidoConfirmado 1.0.0\n\nevents/PedidoConfirmado/index.mdx\n  schemaPath: schema.json\n\nservices/WorkerNotificaciones/index.mdx\n  receives: PedidoConfirmado 1.0.0</code></pre>'],
["","PROBLEMA · DESCUBRIMIENTO ORGANIZACIONAL","El flujo de eventos no es todo el inventario de software",'<div class="grid"><article><h3>Dispersión</h3><p>Servicios, APIs y responsables viven en lugares distintos.</p></article><article><h3>Consecuencia</h3><p>Encontrar qué existe depende de preguntar a una persona.</p></article></div><div class="call">Necesitamos un catálogo general de software.</div>'],
["","DEMO DOCENTE · BACKSTAGE","Inventario común de software y responsables",'<div class="grid three"><article><h3>Concepto</h3><p>Plataforma para construir portales internos y un catálogo de software.</p></article><article><h3>Origen</h3><p>Fue creado en Spotify y luego alojado por la CNCF.</p></article><article><h3>Problema</h3><p>Servicios, APIs y responsables quedan dispersos entre repositorios.</p></article></div><div class="call"><code>Component</code> provee <code>API</code>; OpenAPI se incorpora con <code>$text</code>.</div>'],
["","PROBLEMA · BORRADORES PLAUSIBLES","Una redacción convincente también puede ser falsa",'<div class="grid"><article><h3>La IA puede inventar</h3><p>Estados, permisos, campos o garantías.</p></article><article><h3>Consecuencia</h3><p>Una suposición termina publicada como contrato.</p></article></div><div class="call">Necesitamos revisar cada afirmación contra evidencia.</div>'],
["","IA PARA DOCUMENTAR","Borrador rápido, revisión obligatoria",'<table><tr><th>La IA puede inventar</th><th>Fuente de verdad</th></tr><tr><td>201 en lugar de 200</td><td><code>routes/pedidos.js</code></td></tr><tr><td><code>write:pedidos</code></td><td>middleware y ruta</td></tr><tr><td>Exactly once</td><td>topología y consumidor</td></tr><tr><td>Campos inexistentes</td><td>evento publicado</td></tr></table>'],
["","CIERRE · IA","Revisar una afirmación contra evidencia",'<div class="steps"><div><b>1</b>No compartir secretos ni datos personales.</div><div><b>2</b>Comparar literales con código y configuración.</div><div><b>3</b>Validar sintaxis.</div><div><b>4</b>Ejecutar una prueba representativa.</div><div><b>5</b>Registrar correcciones humanas.</div></div>'],
["","EVIDENCIA · CUATRO RESULTADOS","Demostrar alineación, no cantidad de páginas",'<div class="grid"><article><h3>OpenAPI</h3><p>JSON válido.</p></article><article><h3>Swagger UI</h3><p>URL o captura.</p></article><article><h3>Evento</h3><p>JSON Schema válido.</p></article><article><h3>EventCatalog</h3><p>Vista o archivos más compilación.</p></article></div><div class="call">C4, ADR, Backstage e IA no agregan entregables.</div>'],
["","TPI · ENTREGA 1","Nueva fecha: lunes 05/10/2026",'<div class="grid"><article><h3>Esta clase aporta</h3><p>OpenAPI, C4 y ADR con criterios de revisión.</p></article><article><h3>Se mantiene</h3><p>El enunciado vigente. No se agregan requisitos.</p></article></div><div class="call">Entrega grupal mediante ZIP en UV, sin defensa oral.</div>'],
["dark","CIERRE","Código, contrato y evidencia<br>deben contar la misma historia",'<div class="grid"><article><h3>Hoy</h3><p>Hicimos visible cómo usar, entender y mantener la integración.</p></article><article><h3>Próxima clase</h3><p>Observabilidad: seguir una operación con registros, <code>correlationId</code> y métricas.</p></article></div><div class="call">¿Qué pasaría si un agente ejecuta una operación usando documentación incorrecta?</div>']
];
const speakerNotes=[
'<h3>Lectura visual</h3><p>El título presenta una condición concreta: el sistema funciona, pero otro equipo todavía no puede integrarse sin ayuda.</p><h3>Idea</h3><p>Hoy convertimos comportamiento real en contratos verificables.</p>',
'<h3>Lectura visual</h3><p>Recorrer el flujo de izquierda a derecha. Cliente con clave, API con un efecto, RabbitMQ con retry y DLQ, worker con deduplicación.</p><h3>Transición</h3><p>Tenemos evidencia técnica. Falta hacer ese conocimiento consumible.</p>',
'<h3>Lectura visual</h3><p>Las tres tarjetas representan preguntas reales de otro equipo: HTTP, arquitectura y evento.</p><h3>Pregunta</h3><p>¿Cuánto código tendría que leer una persona nueva para responderlas hoy?</p>',
'<h3>Lectura visual</h3><p>Cada fila une una falta concreta con un artefacto. OpenAPI, C4, ADR y contrato de evento no compiten: responden preguntas distintas.</p>',
'<h3>Recorrido</h3><p>Leer los cuatro bloques y aclarar que suman 120 minutos. La mayor parte es práctica guiada.</p>',
'<h3>Idea</h3><p>Pedir un ejemplo de pregunta que no pueda responder Swagger. Respuesta esperada: por qué se tomó una decisión o cómo se distribuyen responsabilidades.</p>',
'<h3>Problemática</h3><p>Plantear que la ruta funciona, pero el consumidor debe reconstruir el contrato leyendo código. Preguntar qué ocurre si interpreta mal un 503.</p><h3>Puente</h3><p>OpenAPI vuelve explícitas esas reglas.</p>',
'<h3>Concepto</h3><p>OpenAPI es un lenguaje estándar para describir una API HTTP de forma legible por personas y herramientas.</p><h3>Origen</h3><p>Nació como la especificación Swagger y pasó en 2015 a una organización neutral: la OpenAPI Initiative.</p><h3>Problemática</h3><p>Evita que cada consumidor tenga que reconstruir rutas, parámetros, respuestas y seguridad leyendo la implementación.</p>',
'<h3>Lectura visual</h3><p>Recorrer cada estado desde la decisión del consumidor. El contrato no sirve si solo describe el camino exitoso.</p>',
'<h3>Seguridad</h3><p>Marcar scope y flujo servicio a servicio. Recordar audience y separar la API key usada por productos.</p>',
'<h3>Problemática</h3><p>Un JSON en el repositorio puede ser correcto y seguir siendo poco accesible. Una copia manual en otra herramienta puede divergir.</p><h3>Puente</h3><p>Swagger UI presenta el contrato sin crear otra fuente.</p>',
'<h3>Concepto</h3><p>Swagger UI convierte un contrato OpenAPI en una interfaz navegable e interactiva.</p><h3>Origen</h3><p>Nació en el ecosistema Swagger para acercar la especificación a quienes desarrollan y consumen APIs.</p><h3>Problemática</h3><p>Resuelve la dificultad de explorar un archivo crudo, aunque no prueba que la implementación coincida con él.</p>',

eft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});addEventListener('resize',resize);resize();show(Number(location.hash.replace('#D',''))-1||0);
