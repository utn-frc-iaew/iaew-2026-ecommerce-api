const speakerNotes=[
'<h3>Lectura visual</h3><p>El título presenta una condición concreta: el sistema funciona, pero otro equipo todavía no puede integrarse sin ayuda.</p><h3>Idea</h3><p>Hoy convertimos comportamiento real en contratos verificables.</p>',
'<h3>Lectura visual</h3><p>Recorrer el flujo de izquierda a derecha. Cliente con clave, API con un efecto, RabbitMQ con retry y DLQ, worker con deduplicación.</p><h3>Transición</h3><p>Tenemos evidencia técnica. Falta hacer ese conocimiento consumible.</p>',
'<h3>Lectura visual</h3><p>Las tres tarjetas representan preguntas reales de otro equipo: HTTP, arquitectura y evento.</p><h3>Pregunta</h3><p>¿Cuánto código tendría que leer una persona nueva para responderlas hoy?</p>',
'<h3>Lectura visual</h3><p>Cada fila une una falta concreta con un artefacto. OpenAPI, C4, ADR y contrato de evento no compiten: responden preguntas distintas.</p>',
'<h3>Recorrido</h3><p>Leer los cuatro bloques y aclarar que suman 120 minutos. La mayor parte es práctica guiada.</p>',
'<h3>Idea</h3><p>Pedir un ejemplo de pregunta que no pueda responder Swagger. Respuesta esperada: por qué se tomó una decisión o cómo se distribuyen responsabilidades.</p>',
'<h3>Problemática</h3><p>Plantear que la ruta funciona, pero el consumidor debe reconstruir el contrato leyendo código. Preguntar qué ocurre si interpreta mal un 503.</p><h3>Puente</h3><p>OpenAPI vuelve explícitas esas reglas.</p>',
'<h3>Lectura del código</h3><p>Señalar los tres nodos: versión, información y paths. Explicar la diferencia literal entre la ruta Express y OpenAPI.</p>',
'<h3>Lectura visual</h3><p>Recorrer cada estado desde la decisión del consumidor. El contrato no sirve si solo describe el camino exitoso.</p>',
'<h3>Seguridad</h3><p>Marcar scope y flujo servicio a servicio. Recordar audience y separar la API key usada por productos.</p>',
'<h3>Problemática</h3><p>Un JSON en el repositorio puede ser correcto y seguir siendo poco accesible. Una copia manual en otra herramienta puede divergir.</p><h3>Puente</h3><p>Swagger UI presenta el contrato sin crear otra fuente.</p>',
'<h3>Lectura visual</h3><p>La izquierda dice qué aporta la interfaz; la derecha limita la evidencia. Un Swagger visible puede estar desactualizado.</p>',
'<h3>Acción</h3><p>Quien tenga Clase 05 completa puede conservarla. La rama común permite recuperar una base homogénea. Comprobar antes de editar.</p>',
'<h3>Punto de control</h3><p>Pedir que cada estudiante encuentre esos cuatro elementos en su JSON. No avanzar con rutas o permisos diferentes.</p>',
'<h3>Demostración</h3><p>Abrir Swagger UI y luego el JSON crudo. Mostrar que personas y herramientas consumen el mismo contrato.</p>',
'<h3>Problemática</h3><p>OpenAPI describe una operación, pero no permite localizar responsabilidades ni ventanas de inconsistencia.</p><h3>Puente</h3><p>C4 aporta vistas con distintos niveles de zoom.</p>',
'<h3>Lectura visual</h3><p>Explicar los cuatro niveles como zoom. La plantilla usa Container porque permite ver API, base, broker y worker.</p>',
'<h3>Lectura visual</h3><p>Seguir ambos flujos. Señalar que MongoDB aparece conectado a API y worker, mientras RabbitMQ desacopla productor y consumidor.</p>',
'<h3>Pregunta</h3><p>Usar el diagrama para localizar la ventana de inconsistencia. Si no ayuda, necesita mejor propósito en sus relaciones.</p>',
'<h3>Problemática</h3><p>La clave de idempotencia queda visible en el código, pero allí no aparece la razón completa ni las alternativas descartadas.</p><h3>Puente</h3><p>El ADR conserva ese razonamiento.</p>',
'<h3>Lectura visual</h3><p>Recorrer contexto, decisión, consecuencias y límite. El ADR conserva razonamiento; no es una lista de comandos.</p>',
'<h3>Acción</h3><p>Completar cada sección con el caso real. Destacar que un ADR reemplazado se conserva como historia.</p>',

const slides=[...document.querySelectorAll('.slide')];let current=0;const channel='BroadcastChannel' in window?new BroadcastChannel('iaew-clase-06-presenter'):null;function envelope(m){return Object.assign({source:'deck',sentAt:Date.now()},m)}function send(m){const p=envelope(m);if(channel)channel.postMessage(p);localStorage.setItem('iaew-clase-06-presenter-message',JSON.stringify(p))}function state(){return{type:'state',current,total:slides.length,title:data[current][2].replace(/<[^>]*>/g,''),kicker:data[current][1],notes:speakerNotes[current],nextTitle:current+1<data.length?data[current+1][2].replace(/<[^>]*>/g,''):'Fin de la clase'}}function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i!==current)});counter.textContent=(current+1)+' / '+slides.length;history.replaceState(null,'','#D'+String(current+1).padStart(2,'0'));send(state())}function receive(p){if(!p||p.source==='deck')return;if(p.type==='state-request')send(state());if(p.type==='navigate')show(Number(p.index))}if(channel)channel.onmessage=e=>receive(e.data);addEventListener('storage',e=>{if(e.key==='iaew-clase-06-presenter-message'&&e.newValue)receive(JSON.parse(e.newValue))});function resize(){const pad=innerWidth<700?32:70;document.documentElement.style.setProperty('--slide-scale',Math.min((innerWidth-pad)/1280,(innerHeight-pad)/720))}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);presenter.onclick=()=>window.open('presenter.html','iaew-clase-06-presenter','width=1180,height=760');fullscreen.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});addEventListener('resize',resize);resize();show(Number(location.hash.replace('#D',''))-1||0);
