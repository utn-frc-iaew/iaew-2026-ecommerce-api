<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 290" role="img" aria-labelledby="title"><title id="title">Identificadores creados en API y worker con y sin propagación</title><g font-family="Arial,sans-serif" fill="#17394e"><rect x="10" y="10" width="330" height="145" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="26" y="40" font-size="22">1 · API / publicación</text><text x="26" y="68" font-size="18">SDK crea trace_id: A</text><text x="26" y="93" font-size="18">Span HTTP: H; publicar: P</text><text x="26" y="118" font-size="18">App crea correlation_id: C</text><rect x="375" y="10" width="330" height="145" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="391" y="40" font-size="22">2 · Headers AMQP</text><text x="391" y="68" font-size="18">traceparent: A + padre P</text><text x="391" y="93" font-size="18">x-correlation-id: C</text><text x="391" y="118" font-size="18">Mensaje: pedido_id P-42</text><rect x="740" y="10" width="330" height="145" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="756" y="40" font-size="22">3 · Worker</text><text x="756" y="68" font-size="18">SDK crea span_id: W</text><text x="756" y="93" font-size="18">Conserva trace_id: A</text><text x="756" y="118" font-size="18">App conserva correlación: C</text><text x="10" y="195" font-size="22">Con propagación: API y worker comparten A; H, P y W son etapas distintas.</text><text x="10" y="232" font-size="22">Sin propagación: API usa A, worker crea B; ambos conservan C.</text><text x="10" y="270" font-size="17">A, B, C, H, P y W son abreviaturas; trace_id real: 32 hex, span_id: 16 hex.</text></g></svg>