<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 200" role="img" aria-labelledby="title"><title id="title">Una imagen produce varias instancias; los volúmenes conservan datos</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#008eaa"/></marker></defs><g font-family="Arial, sans-serif"><rect x="20" y="44" width="235" height="110" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="137.5" y="75" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Imagen</text><text x="137.5" y="102" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Código + dependencias</text><rect x="370" y="12" width="250" height="76" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="495.0" y="43" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Contenedor A</text><text x="495.0" y="70" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Instancia ejecutándose</text><rect x="370" y="112" width="250" height="76" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="495.0" y="143" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Contenedor B</text><text x="495.0" y="170" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Otra instancia</text><path d="M255,100 L365,50" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><path d="M255,100 L365,150" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><rect x="775" y="58" width="280" height="108" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="915.0" y="89" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Volumen</text><text x="915.0" y="116" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Datos persistentes</text><path d="M625,50 L770,90" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><path d="M625,150 L770,130" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /></g></svg>