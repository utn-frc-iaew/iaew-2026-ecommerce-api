<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 210" role="img" aria-labelledby="title"><title id="title">La API responde 200, RabbitMQ retiene el mensaje y el worker encuentra una demora</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#008eaa"/></marker></defs><g font-family="Arial, sans-serif"><rect x="10" y="40" width="225" height="100" rx="12" fill="#daf0e9" stroke="#bdd4de" stroke-width="2"/><text x="122.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">API: HTTP 200</text><text x="122.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Petición terminada</text><rect x="285" y="40" width="225" height="100" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="397.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">RabbitMQ</text><text x="397.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Evento pendiente</text><rect x="560" y="40" width="225" height="100" rx="12" fill="#fff0dc" stroke="#bdd4de" stroke-width="2"/><text x="672.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Worker</text><text x="672.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Demora / error</text><rect x="835" y="40" width="225" height="100" rx="12" fill="#f8e2df" stroke="#bdd4de" stroke-width="2"/><text x="947.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Cocina</text><text x="947.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Resultado ausente</text><path d="M245,90 L275,90" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><path d="M520,90 L550,90" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><path d="M795,90 L825,90" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><text x="535" y="186" font-size="20" fill="#17394e" text-anchor="middle" font-weight="400">La respuesta HTTP y la finalización del negocio son hechos distintos.</text></g></svg>