<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 225" role="img" aria-labelledby="title"><title id="title">Seleccionar span, abrir logs por trace_id y contrastar recursos por servicio y tiempo</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#008eaa"/></marker></defs><g font-family="Arial, sans-serif"><rect x="10" y="25" width="310" height="150" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="165.0" y="56" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">1 · Traza en Tempo</text><text x="165.0" y="83" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Pedido P-42</text><text x="165.0" y="107" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">span lento del worker</text><rect x="385" y="25" width="310" height="150" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="540.0" y="56" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">2 · Logs en Loki</text><text x="540.0" y="83" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Mismo trace_id</text><text x="540.0" y="107" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Detalle: TimeoutError</text><rect x="760" y="25" width="310" height="150" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="915.0" y="56" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">3 · Métricas</text><text x="915.0" y="83" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Worker + intervalo</text><text x="915.0" y="107" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">CPU, memoria, errores</text><path d="M330,100 L375,100" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><path d="M705,100 L750,100" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><text x="540" y="213" font-size="19" fill="#17394e" text-anchor="middle" font-weight="400">Grafana conecta fuentes; los vínculos se configuran y los atributos deben coincidir.</text></g></svg>