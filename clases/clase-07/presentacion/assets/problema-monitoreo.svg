<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 242" role="img" aria-labelledby="title"><title id="title">Sin monitoreo el cliente descubre el fallo; con monitoreo las sondas y señales lo detectan</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#008eaa"/></marker></defs><g font-family="Arial, sans-serif"><rect x="5" y="12" width="320" height="90" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="165.0" y="43" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Problema</text><text x="165.0" y="70" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Nadie mira el dashboard</text><rect x="380" y="12" width="320" height="90" rx="12" fill="#f8e2df" stroke="#bdd4de" stroke-width="2"/><text x="540.0" y="43" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Fallo silencioso</text><text x="540.0" y="70" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Servicio o flujo degradado</text><rect x="755" y="12" width="320" height="90" rx="12" fill="#fff0dc" stroke="#bdd4de" stroke-width="2"/><text x="915.0" y="43" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Cliente reclama</text><text x="915.0" y="70" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Detección tardía</text><path d="M335,57 L370,57" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><path d="M710,57 L745,57" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><rect x="5" y="137" width="320" height="80" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="165.0" y="168" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Sonda externa</text><text x="165.0" y="195" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">¿Responde el endpoint?</text><rect x="380" y="137" width="320" height="80" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="540.0" y="168" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Métricas internas</text><text x="540.0" y="195" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">¿Completa pedidos a tiempo?</text><rect x="755" y="137" width="320" height="80" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="915.0" y="168" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Evaluación periódica</text><text x="915.0" y="195" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Detectar degradación</text><path d="M165,219 L165,230 L745,230 L745,198" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)"/><path d="M710,177 L745,177" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /></g></svg>