<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title"><title id="title">Compose levanta seis servicios; LGTM agrupa cinco componentes; Auth0 es externo</title><g font-family="Arial,sans-serif" fill="#17394e"><rect x="10" y="10" width="820" height="265" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="26" y="40" font-size="22">Dentro de Docker Compose</text><text x="26" y="68" font-size="18">api → rabbitmq → worker</text><text x="26" y="93" font-size="18">api y worker → mongodb</text><text x="26" y="118" font-size="18">api y worker → lgtm por OTLP</text><text x="26" y="143" font-size="18">cadvisor → lgtm / Prometheus por scrape</text><rect x="410" y="65" width="395" height="175" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="426" y="95" font-size="22">Un servicio: lgtm</text><text x="426" y="123" font-size="18">Collector: recibe señales</text><text x="426" y="148" font-size="18">Loki: logs · Tempo: trazas</text><text x="426" y="173" font-size="18">Prometheus: métricas</text><text x="426" y="198" font-size="18">Grafana: consulta y alertas</text><rect x="850" y="10" width="220" height="130" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="866" y="40" font-size="22">Fuera de Compose</text><text x="866" y="68" font-size="18">Auth0: JWT / JWKS</text><text x="866" y="93" font-size="18">Navegador: Grafana</text><rect x="850" y="155" width="220" height="120" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="866" y="185" font-size="22">Bajo demanda</text><text x="866" y="213" font-size="18">tools: genera pedidos</text><text x="866" y="238" font-size="18">También en Docker</text></g></svg>