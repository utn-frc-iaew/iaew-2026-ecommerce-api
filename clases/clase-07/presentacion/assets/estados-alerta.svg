<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 205" role="img" aria-labelledby="title"><title id="title">Normal pasa a Pending y luego Firing si la condición persiste; puede recuperarse</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#008eaa"/></marker></defs><g font-family="Arial, sans-serif"><rect x="10" y="40" width="280" height="100" rx="12" fill="#daf0e9" stroke="#bdd4de" stroke-width="2"/><text x="150.0" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Normal</text><text x="150.0" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Condición no cumplida</text><rect x="400" y="40" width="280" height="100" rx="12" fill="#fff0dc" stroke="#bdd4de" stroke-width="2"/><text x="540.0" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Pending</text><text x="540.0" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Se cumple; esperar</text><rect x="790" y="40" width="280" height="100" rx="12" fill="#f8e2df" stroke="#bdd4de" stroke-width="2"/><text x="930.0" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Firing</text><text x="930.0" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Se mantuvo el tiempo</text><path d="M300,90 L390,90" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><path d="M690,90 L780,90" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><text x="340" y="70" font-size="16" fill="#17394e" text-anchor="middle" font-weight="400">umbral</text><text x="730" y="70" font-size="16" fill="#17394e" text-anchor="middle" font-weight="400">persiste</text><text x="540" y="190" font-size="18" fill="#17394e" text-anchor="middle" font-weight="400">Si deja de cumplirse, vuelve a normal según la configuración de recuperación.</text></g></svg>