<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 210" role="img" aria-labelledby="title"><title id="title">En pico de demanda, métricas detectan impacto, traza localiza demora, logs detallan fallo y recursos ayudan a contrastar</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#008eaa"/></marker></defs><g font-family="Arial, sans-serif"><rect x="10" y="40" width="245" height="105" rx="12" fill="#fff0dc" stroke="#bdd4de" stroke-width="2"/><text x="132.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Métricas</text><text x="132.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">p95 y pendientes suben</text><rect x="280" y="40" width="245" height="105" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="402.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Traza</text><text x="402.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Worker concentra demora</text><path d="M259,92 L275,92" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><rect x="550" y="40" width="245" height="105" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="672.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Logs</text><text x="672.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">Timeout de dependencia</text><path d="M529,92 L545,92" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><rect x="820" y="40" width="245" height="105" rx="12" fill="#e5eff4" stroke="#bdd4de" stroke-width="2"/><text x="942.5" y="71" font-size="20" fill="#17394e" text-anchor="middle" font-weight="700">Recursos</text><text x="942.5" y="98" font-size="17" fill="#17394e" text-anchor="middle" font-weight="400">CPU / memoria: contexto</text><path d="M799,92 L815,92" fill="none" stroke="#008eaa" stroke-width="3" marker-end="url(#arrow)" /><text x="540" y="189" font-size="18" fill="#17394e" text-anchor="middle" font-weight="400">Actuar sobre la dependencia o capacidad y verificar que el p95 y los pendientes bajan.</text></g></svg>