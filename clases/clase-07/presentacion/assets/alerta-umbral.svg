<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 290" role="img" aria-labelledby="title"><title id="title">Ventana de dos minutos, evaluación cada diez segundos y persistencia de treinta segundos</title><g font-family="Arial,sans-serif" fill="#17394e"><rect x="10" y="10" width="340" height="110" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="26" y="40" font-size="22">Ventana: últimos 2 min</text><text x="26" y="68" font-size="18">Promedio por intento</text><text x="26" y="93" font-size="18">Umbral: mayor que 1 s</text><rect x="370" y="10" width="340" height="110" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="386" y="40" font-size="22">Evaluación: cada 10 s</text><text x="386" y="68" font-size="18">Recalcular la consulta</text><text x="386" y="93" font-size="18">No es la persistencia</text><rect x="730" y="10" width="340" height="110" rx="12" fill="#e5eff4" stroke="#008eaa" stroke-width="2"/><text x="746" y="40" font-size="22">Persistencia: 30 s</text><text x="746" y="68" font-size="18">Condición sostenida</text><text x="746" y="93" font-size="18">Luego pasa a Firing</text><text x="35" y="175" font-size="22">Ejemplo: el promedio supera 1 s en cuatro evaluaciones consecutivas.</text><text x="35" y="222" font-size="20">t = 0 s: Pending     →     10 s: Pending     →     20 s: Pending     →     30 s: Firing</text><text x="35" y="270" font-size="20">Firing no envía un aviso por sí solo: hacen falta política y contacto.</text></g></svg>