e{background:#16374b;border-color:#375467}.call{background:#daf0e9;border-left:5px solid #28a978;padding:13px 18px;font-size:18px;line-height:1.38}.dark .call{background:#18453f}pre{white-space:pre-wrap;background:#111e2d;color:#e5f8ff;border-radius:12px;padding:16px 22px;font-size:17px;line-height:1.32;margin:0 0 12px}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;margin-bottom:12px}th{text-align:left;background:#d9e8ef}th,td{padding:9px 12px;border-bottom:1px solid #c9d8e2}.flow{display:flex;align-items:center;gap:10px;margin-bottom:20px}.flow b{flex:1;background:#dfebf1;border:1px solid #bed2dc;padding:18px 8px;border-radius:10px;text-align:center;font-size:18px}.flow i{font-style:normal;color:#008eaa;font-size:24px}.steps{display:grid;gap:10px}.steps div{padding:12px 16px;background:#e6eef3;border-radius:9px;font-size:18px}.steps b{color:#007b95;margin-right:12px}.tag{display:inline-block;border:1px solid #4c726e;color:#8ce7d3;padding:10px 14px;border-radius:6px;margin-top:12px;font-size:14px;letter-spacing:.05em}.footer{position:absolute;z-index:3;left:80px;right:80px;bottom:22px;display:flex;align-items:center;gap:15px;font-size:12px;color:#627484}.footer img{height:29px;max-width:130px;object-fit:contain;margin-left:auto}.dark .footer{color:#abc5d7}.nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;color:#ddeaf3;font-size:13px}button{border:1px solid #446076;background:#143247;color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer}@media print{@page{size:1280px 720px;margin:0}html,body{height:auto;overflow:visible;background:white}.deck{display:block;padding:0}.slide,.slide.active{position:relative;display:flex;transform:none;break-after:page;border-radius:0;box-shadow:none}.nav{display:none}}
.timeline{display:grid;gap:14px;margin-bottom:18px}.timeline div{position:relative;height:58px;padding-left:200px}.timeline b{position:absolute;left:0;top:14px;width:195px;font-size:17px}.timeline span{display:block;max-width:100%;background:#2c9e9e;color:white;padding:13px;border-radius:7px;font:18px ui-monospace,monospace}.timeline .slow{background:#be6337}a{color:#007b95}.dark a{color:#67d7e7}.notes-list li{margin-bottom:14px}.teaching-figure{margin:0 0 16px}.teaching-figure img{display:block;width:100%;max-height:270px;object-fit:contain}.teaching-figure+p{margin-bottom:12px}.lab-note{margin:10px 0 0;font-size:16px;color:#526b7d}</style></head><body><main class="deck" id="deck" aria-label="Presentación Clase 07"></main><nav class="nav"><button id="prev">←</button><span id="counter"></span><button id="next">→</button><button id="presenter">Vista del orador</button><button id="fullscreen">Pantalla completa</button></nav>
<script>
const data=[["dark", "CLASE 07 · 05/10/2026", "Integración de Aplicaciones<br>en Entorno Web", "<p class=\"subtitle\">Observabilidad de servicios: del síntoma a la evidencia.</p><div class=\"tag\">TRAZAS · LOGS · MÉTRICAS · CORRELACIÓN</div>"], ["", "CONTINUIDAD · CLASE 06", "El contrato dice qué debería pasar", "<div class=\"flow\"><b>Cliente</b><i>→</i><b>API de pedidos</b><i>→</i><b>RabbitMQ</b><i>→</i><b>Worker</b></div><div class=\"grid \"><article><h3>Resultado anterior</h3><p>OpenAPI describe cómo confirmar; el schema describe <code>pedido.confirmado</code>.</p></article><article><h3>Evidencia anterior</h3><p>Swagger UI, contrato del evento y relaciones entre productor y consumidor.</p></article></div><div class=\"call\">La documentación explica lo esperado. Ahora necesitamos observar lo que ocurrió realmente.</div>"], ["", "PROBLEMÁTICA · SISTEMA DISTRIBUIDO", "«El pedido fue aceptado, pero no llegó a cocina»", "<figure class=\"teaching-figure\"><img src=\"assets/problema-pedido.svg\" alt=\"La API responde 200, RabbitMQ retiene el mensaje y el worker encuentra una demora\"></figure><div class=\"call\">¿Dónde se interrumpió el recorrido? ¿Afecta a un pedido o a todos?</div>"], ["", "PROBLEMÁTICA · VISIBILIDAD", "Cada servicio ve una parte de la historia", "<div class=\"grid three\"><article><h3>Logs separados</h3><p>Mensajes intercalados entre réplicas y servicios.</p></article><article><h3>Tiempo y concurrencia</h3><p>Muchos pedidos similares ocurren a la vez.</p></article><article><h3>Límites asíncronos</h3><p>La petición termina antes que el consumo del evento.</p></article></div><div class=\"call\">Un contenedor «running» y un endpoint «healthy» no prueban que el negocio funciona.</div>"], ["", "INTRODUCCIÓN", "¿Por qué observabilidad?", "<div class=\"grid \"><article><h3>Observabilidad</h3><p>Capacidad de inferir el estado interno a partir de las señales que emite el sistema.</p></article><article><h3>Monitoreo</h3><p>Seguimiento de condiciones conocidas: disponibilidad, errores, tiempos y recursos.</p></article></div><div class=\"call\">Monitoreamos: «hay una demora». Investigamos: «¿qué cambió y dónde se produce?»</div>"], ["", "RUTA · 120 MINUTOS", "Primero comprender; después aplicar", "<table><tr><th>Bloque</th><th>Tiempo</th></tr><tr><td>Problema, continuidad y objetivo</td><td>10 min</td></tr><tr><td>Repaso de Docker y Compose</td><td>15 min</td></tr><tr><td>Señales, instrumentación y correlación</td><td>25 min</td></tr><tr><td>Herramientas y lectura de incidentes</td><td>10 min</td></tr><tr><td>Monitores y alertas</td><td>10 min</td></tr><tr><td>Práctico individual con entorno preparado</td><td>45 min</td></tr><tr><td>Síntesis y TPI</td><td>5 min</td></tr></table><div class=\"call\">120 minutos. Descargar imágenes y configurar Auth0 antes de clase.</div>"], ["", "REPASO · DOCKER", "Una imagen se ejecuta como contenedor", "<figure class=\"teaching-figure\"><img src=\"assets/docker-imagen.svg\" alt=\"Una imagen produce varias instancias; los volúmenes conservan datos\"></figure><div class=\"call\">Puertos: conectividad · Variables: configuración · Volúmenes: persistencia.</div>"], ["", "REPASO · COMPOSE", "Describir el sistema en un archivo", "<pre>services:\n  api:\n    image: ejemplo/pedidos-api:version-fijada\n    environment:\n      RABBIT_URL: amqp://rabbitmq:5672\n    ports:\n      - &quot;3000:3000&quot;\n  rabbitmq:\n    image: rabbitmq:version-fijada</pre><div class=\"call\">Fragmento conceptual. El laboratorio incluye el Compose completo y ejecutable.</div>"], ["", "REPASO · OPERACIÓN", "Arrancar, comprobar y detener", "<pre>docker compose up -d --build --wait --wait-timeout 300\ndocker compose ps\ndocker compose logs --tail=50 api worker\ndocker compose down</pre><div class=\"call\">¿Qué perdemos al mirar solamente logs separados?</div>"], ["", "INTRODUCCIÓN · TELEMETRÍA", "Tres señales, tres preguntas", "<figure class=\"teaching-figure\"><img src=\"assets/tres-senales.svg\" alt=\"Logs detallan hechos, métricas muestran tendencias y trazas conectan etapas\"></figure><div class=\"call\">Hechos + tendencias + recorrido: tres perspectivas complementarias.</div>"], ["", "LOGS · CONCEPTO", "Registrar hechos con contexto", "<pre>{\n  &quot;timestamp&quot;: &quot;2026-10-05T10:00:03Z&quot;,\n  &quot;level&quot;: &quot;error&quot;, &quot;service.name&quot;: &quot;worker&quot;,\n  &quot;event&quot;: &quot;pedido.procesamiento_fallido&quot;, &quot;pedido_id&quot;: &quot;P-42&quot;,\n  &quot;trace_id&quot;: &quot;4bf92f3577b34da6a3ce929d0e0e4736&quot;,\n  &quot;span_id&quot;: &quot;00f067aa0ba902b7&quot;, &quot;error.type&quot;: &quot;TimeoutError&quot;\n}</pre><div class=\"call\">Ejemplo ilustrativo. JSON permite filtrar campos sin interpretar frases libres.</div>"], ["", "LOGS · REQUISITOS", "¿Qué hace falta para tener logs útiles?", "<div class=\"flow\"><b>Logger estructurado</b><i>→</i><b>Contexto activo</b><i>→</i><b>Recolección / exportación</b><i>→</i><b>Loki → Grafana</b></div><div class=\"grid \"><article><h3>En la aplicación</h3><p>Definir eventos, niveles, timestamps y atributos; añadir contexto de traza al emitir el registro.</p></article><article><h3>En la plataforma</h3><p>Enviar por OTLP o recoger stdout; procesar, almacenar y configurar la búsqueda.</p></article></div><div class=\"call\">Escribir en consola no garantiza que Loki reciba el registro.</div>"], ["", "LOGS · DEL CÓDIGO A LA CONSULTA", "¿Cómo genera logs nuestra aplicación?", "<div class=\"grid\"><article><h3>1 · El código registra un hecho</h3><pre>log('pedido.processed', {\n  pedido_id: event.data.pedidoId,\n  event_id: event.eventId\n});</pre><p>Elegimos dónde registrar éxito, falla o reintento.</p></article><article><h3>2 · El logger agrega contexto</h3><pre>{\n  \"level\": \"info\",\n  \"service.name\": \"pedidos-worker\",\n  \"event\": \"pedido.processed\",\n  \"pedido_id\": \"P-42\",\n  \"trace_id\": \"A\", \"span_id\": \"W\",\n  \"correlation_id\": \"C\"\n}</pre></article></div><div class=\"flow\"><b>Logger</b><i>→</i><b>OTLP → Collector</b><i>→</i><b>Loki</b><i>→</i><b>Grafana</b></div><div class=\"call\">También escribe JSON en stdout para <code>docker compose logs</code>. El contexto viene del span activo; OpenTelemetry no inventa eventos de negocio.</div><p class=\"lab-note\">Registro abreviado: también incluye timestamp y event_id. P-42, A, W y C son valores ilustrativos.</p>"], ["", "MÉTRICAS · CONCEPTO", "Medir comportamientos y tendencias", "<figure class=\"teaching-figure\"><img src=\"assets/tipos-metricas.svg\" alt=\"Contador acumulativo, gauge variable e histograma de duración\"></figure><p class=\"lab-note\"><b>Gauge = valor actual:</b> puede subir o bajar. Ejemplos: memoria usada, conexiones activas o mensajes pendientes (12 → 3).</p><div class=\"call\"><b>p95:</b> tiempo dentro del cual termina aproximadamente el 95 % de los intentos. <b>Ejemplo:</b> 95 intentos duran 0,1 s y 5 duran 3 s. Promedio: 0,245 s; p95 por rango más próximo: 0,1 s. El 5 % más lento puede quedar fuera del p95.</div>"], ["", "MÉTRICAS · DOS NIVELES", "Servicio y contenedor responden preguntas distintas", "<div class=\"grid \"><article><h3>Aplicación / negocio</h3><p>Latencia, solicitudes por segundo, tasa de errores; confirmados, rechazados y duplicados.</p></article><article><h3>Contenedor / recursos</h3><p>CPU, memoria, red y límites. cAdvisor recoge métricas que Prometheus consulta.</p></article></div><div class=\"call\">La API respondió 200: ¿demuestra que el worker terminó? ¿Una espera larga exige CPU alta?</div>"], ["", "MÉTRICAS · REQUISITOS", "Instrumentar, recoger, conservar y consultar", "<div class=\"flow\"><b>SDK / exporter</b><i>→</i><b>OTLP o /metrics</b><i>→</i><b>Collector / Prometheus</b><i>→</i><b>Panel de Grafana</b></div><div class=\"grid \"><article><h3>Aplicación</h3><p>Contadores e histogramas en el código, atributos estables y unidades explícitas.</p></article><article><h3>Infraestructura</h3><p>cAdvisor, permisos adecuados, objetivo de scrape y etiquetas que identifiquen el servicio.</p></article></div><div class=\"call\">Scrape: consultar periódicamente un endpoint de métricas. Las dos rutas de envío son alternativas configurables.</div>"], ["", "TRAZAS · CONCEPTO", "Una operación, varias etapas", "<div class=\"timeline\"><div><b>API · confirmar</b><span style=\"width:38%\">180 ms</span></div><div><b>Publicar evento</b><span style=\"width:16%;margin-left:15%\">30 ms</span></div><div><b>Worker · procesar</b><span class=\"slow\" style=\"width:65%;margin-left:25%\">2 800 ms</span></div><div><b>Guardar resultado</b><span style=\"width:18%;margin-left:68%\">120 ms</span></div></div><div class=\"call\">Esquema ilustrativo, no a escala. Span = etapa con inicio, fin, atributos y relación causal.</div><p class=\"lab-note\">En este laboratorio: HTTP, publicar, consumir y dependencia simulada. Sin spans separados por consulta MongoDB ni por espera en cola.</p>"], ["", "TRAZAS · REQUISITOS", "La traza necesita instrumentación y contexto", "<div class=\"flow\"><b>Instrumentar API</b><i>→</i><b>Propagar contexto</b><i>→</i><b>Instrumentar worker</b><i>→</i><b>Exportar a Tempo</b></div><div class=\"grid \"><article><h3>Automática</h3><p>Instrumentaciones disponibles para HTTP, DB y bibliotecas compatibles.</p></article><article><h3>Manual</h3><p>Spans de negocio y límites no cubiertos: publicar, consumir, reintentar y procesar.</p></article></div><div class=\"call\">OpenTelemetry no descubre todo automáticamente: una etapa sin instrumentar puede quedar invisible.</div>"], ["", "CORRELACIÓN · EL PROBLEMA", "Sin un vínculo, tres pantallas son tres historias", "<figure class=\"teaching-figure\"><img src=\"assets/correlacion-contexto.svg\" alt=\"Sin propagación hay dos trazas; con propagación API y worker comparten trace_id\"></figure><div class=\"call\">Logs ↔ traza: identificadores. Recursos ↔ operación: servicio y ventana temporal.</div>"], ["", "CORRELACIÓN · IDENTIFICADORES", "Cuatro identificadores, cuatro responsabilidades", "<table><tr><th>Identificador</th><th>Para qué sirve</th></tr><tr><td>pedido_id</td><td>Identifica la entidad de negocio; puede participar en muchas operaciones.</td></tr><tr><td>correlation_id</td><td>Identificador elegido por la aplicación para relacionar un flujo; debe propagarse.</td></tr><tr><td>trace_id / span_id</td><td>Identifican la traza y una etapa concreta, respectivamente.</td></tr><tr><td>Idempotency-Key</td><td>Evita repetir el efecto de una operación según el contrato de la API.</td></tr></table><div class=\"call\">Un reintento puede conservar la clave idempotente y producir otra traza. No son identificadores intercambiables.</div>"], ["", "CORRELACIÓN · PROPAGACIÓN", "El contexto debe cruzar RabbitMQ", "<figure class=\"teaching-figure\"><img src=\"assets/propagacion-amqp.svg\" alt=\"Identificadores creados en API y worker con y sin propagación\"></figure><div class=\"call\">El SDK crea los IDs de traza y span. La aplicación crea y transporta la correlación; el logger registra el contexto activo.</div>"], ["", "CORRELACIÓN · EN GRAFANA", "De una traza a sus logs y recursos", "<figure class=\"teaching-figure\"><img src=\"assets/navegacion-correlacion.svg\" alt=\"Seleccionar span, abrir logs por trace_id y contrastar recursos por servicio y tiempo\"></figure><div class=\"call\">Los recursos son agregados: no representan el consumo exclusivo del pedido P-42.</div>"], ["", "HERRAMIENTAS · ELEGIR POR NECESIDAD", "Cada herramienta resuelve una parte", "<table><tr><th>Necesidad</th><th>Herramienta</th><th>Por qué</th></tr><tr><td>Generar y transportar telemetría</td><td>OpenTelemetry + Collector</td><td>SDKs y protocolo común; recepción, procesamiento y envío.</td></tr><tr><td>Consultar logs</td><td>Loki</td><td>Almacena logs y permite filtrarlos con LogQL.</td></tr><tr><td>Reconstruir operaciones</td><td>Tempo</td><td>Almacena trazas y permite encontrarlas con TraceQL.</td></tr><tr><td>Consultar series temporales</td><td>Prometheus</td><td>Recoge métricas y consulta agregados con PromQL.</td></tr><tr><td>Recursos de contenedores</td><td>cAdvisor</td><td>Expone consumo y estadísticas de contenedores.</td></tr><tr><td>Relacionar y visualizar</td><td>Grafana</td><td>Une fuentes en Explore, dashboards y alertas.</td></tr></table>"], ["", "HERRAMIENTAS · ALTERNATIVAS", "El objetivo no depende de una marca", "<table><tr><th>Opción</th><th>Cuándo elegirla</th><th>Qué exige</th></tr><tr><td>Grafana + Loki + Tempo + Prometheus</td><td>Explorar las tres señales y sus relaciones.</td><td>Instrumentación y configuración de las fuentes.</td></tr><tr><td>SigNoz</td><td>Una plataforma integrada centrada en OpenTelemetry.</td><td>Backend e instrumentación; validar recursos del entorno.</td></tr><tr><td>Elastic + Kibana</td><td>Ecosistema Elastic y análisis de logs/APM.</td><td>Elasticsearch, ingestión e instrumentación correspondiente.</td></tr><tr><td>Jaeger</td><td>Foco en trazas distribuidas.</td><td>Instrumentación; otros backends para logs y métricas.</td></tr><tr><td>Servicio administrado</td><td>Reducir la operación del backend local.</td><td>Cuenta, conectividad, credenciales y límites del servicio.</td></tr></table><div class=\"call\">Para esta clase: Grafana, por el recorrido traza → logs → métricas en una misma interfaz.</div>"], ["", "INFRAESTRUCTURA · PROPUESTA", "Un entorno preparado para aprender", "<figure class=\"teaching-figure\"><img src=\"assets/compose-completo.svg\" alt=\"Compose levanta seis servicios; LGTM agrupa cinco componentes; Auth0 es externo\"></figure><pre>docker compose up -d --build --wait --wait-timeout 300</pre>"], ["", "INCIDENTE · DATOS ILUSTRATIVOS", "Primero encontrar la etapa lenta", "<figure class=\"teaching-figure\"><img src=\"assets/incidente-evidencia.svg\" alt=\"Traza lenta del worker, log TimeoutError y CPU estable en el mismo intervalo\"></figure><div class=\"call\">Datos ilustrativos. Hipótesis: dependencia lenta. Verificar sus tiempos antes de atribuir la causa.</div>"], ["", "INCIDENTE · RAZONAMIENTO", "Del síntoma a una explicación comprobable", "<div class=\"steps\"><div><b>Síntoma</b>El pedido tarda en completar su procesamiento.</div><div><b>Alcance</b>Las métricas muestran cuántas operaciones están afectadas.</div><div><b>Localización</b>La traza identifica la etapa donde se consume el tiempo.</div><div><b>Detalle</b>Los logs asociados explican el evento o error.</div><div><b>Contraste</b>Recursos y dependencia permiten evaluar hipótesis.</div></div><div class=\"call\">Una acción correctiva debe producir una mejora observable y verificable.</div>"], ["", "MONITOREO · PROBLEMA Y SOLUCIÓN", "Si nadie mira, el fallo pasa inadvertido", "<figure class=\"teaching-figure\"><img src=\"assets/problema-monitoreo.svg\" alt=\"Sin monitoreo el cliente descubre el fallo; con monitoreo las sondas y señales lo detectan\"></figure><div class=\"call\">Solución: observar continuamente disponibilidad, comportamiento y resultado de negocio.</div>"], ["", "MONITOREO · HERRAMIENTAS", "¿Cómo comprobamos que el servicio funciona?", "<figure class=\"teaching-figure\"><img src=\"assets/herramientas-monitoreo.svg\" alt=\"Sondas y métricas producen datos que Prometheus conserva y Grafana permite consultar\"></figure><div class=\"grid\"><article><h3>Desde afuera</h3><p>Blackbox Exporter: sondas HTTP, TCP y DNS. Para probar el negocio completo, una prueba sintética específica.</p></article><article><h3>Desde adentro</h3><p>OpenTelemetry: métricas del servicio. cAdvisor: recursos. RabbitMQ exporter/plugin: estado de colas.</p></article></div>"], ["", "MONITOREO · SALUD DEL SERVICIO", "Liveness y readiness: dos decisiones", "<figure class=\"teaching-figure\"><img src=\"assets/liveness-readiness.svg\" alt=\"Liveness decide recuperación del proceso; readiness decide recepción de tráfico\"></figure><div class=\"call\">Laboratorio: <code>/health</code> solo comprueba respuesta HTTP. No prueba DB, broker ni el flujo completo; Compose no separa ambas sondas.</div>"], ["", "ALERTAS · PROBLEMA Y SOLUCIÓN", "Detectar no alcanza: hay que avisar y actuar", "<figure class=\"teaching-figure\"><img src=\"assets/alerta-umbral.svg\" alt=\"Ventana de dos minutos, evaluación cada diez segundos y persistencia de treinta segundos\"></figure><div class=\"call\">Regla del práctico: <b>Worker lento (promedio de intentos)</b>. No hay notificaciones externas configuradas.</div>"], ["", "ALERTAS · ESTADOS", "Pendiente no significa notificada", "<figure class=\"teaching-figure\"><img src=\"assets/estados-alerta.svg\" alt=\"Normal pasa a Pending y luego Firing si la condición persiste; puede recuperarse\"></figure><div class=\"call\"><b>No Data:</b> faltan datos. <b>Error:</b> falla la evaluación. Definir su tratamiento; no asumir normalidad.</div>"], ["", "ALERTAS · CRITERIO", "Alertar por impacto; usar recursos como contexto", "<div class=\"grid \"><article><h3>Síntoma accionable</h3><p>Demora sostenida, errores técnicos o pedidos que no completan su flujo.</p></article><article><h3>Contexto diagnóstico</h3><p>CPU alta, memoria cerca del límite o crecimiento de pendientes.</p></article></div><div class=\"call\">Cada alerta debe indicar servicio, condición, período, responsable y primer paso de diagnóstico.</div>"], ["", "ALERTAS · HERRAMIENTAS", "Dos rutas para evaluar y notificar", "<figure class=\"teaching-figure\"><img src=\"assets/herramientas-alertas.svg\" alt=\"Ruta Grafana: fuentes, reglas, políticas y contactos\"></figure><div class=\"call\"><b>Alternativa:</b> reglas en Prometheus → Alertmanager → contacto. Alertmanager agrupa, silencia y enruta; no recoge métricas.</div>"], ["", "APLICACIÓN · CUÁNDO IMPORTA", "Cuando el fallo cruza servicios y afecta al negocio", "<figure class=\"teaching-figure\"><img src=\"assets/caso-observabilidad-completa.svg\" alt=\"En pico de demanda, métricas detectan impacto, traza localiza demora, logs detallan fallo y recursos ayudan a contrastar\"></figure><p><b>Caso:</b> pico de pedidos; la API responde, pero aumenta el tiempo hasta completar el procesamiento.</p><div class=\"call\"><b>También útil:</b> regresión tras un despliegue, dependencia externa intermitente y reintentos o duplicados difíciles de reconstruir.</div>"], ["", "SÍNTESIS · PRÁCTICO INDIVIDUAL", "Así se construye un diagnóstico con evidencia", "<table><tr><th>Señal</th><th>Ejemplo guiado del escenario lento</th></tr><tr><td>Traza</td><td>API responde; dependencia.simulada tarda ~3 s en el worker.</td></tr><tr><td>Logs de esa traza</td><td>pedido.failed → pedido.retry → pedido.processed.</td></tr><tr><td>Métricas del período</td><td>Duración por intento aumenta; comparar CPU y memoria reales.</td></tr><tr><td>Alerta</td><td>Promedio &gt; 1 s sostenido 30 s: Pending → Firing.</td></tr></table><div class=\"call\"><b>Conclusión:</b> hay una espera y una falla transitoria configuradas. Sin medir recursos, no podemos atribuirla a saturación de CPU.</div><p class=\"lab-note\">Ejemplo guiado, no captura de tu ejecución. Tu entrega debe incluir capturas, IDs y período propios.</p>"], ["", "CIERRE · PREGUNTAS", "¿Podemos explicar qué pasó?", "<div class=\"grid three\"><article><h3>Traza</h3><p>¿Dónde se demoró la operación?</p></article><article><h3>Logs</h3><p>¿Qué registró esa etapa?</p></article><article><h3>Métricas</h3><p>¿Cuántas operaciones afectó y cómo estaban los recursos?</p></article></div><div class=\"call\">Correlación conecta la evidencia. Monitoreo detecta condiciones. Alertas movilizan una respuesta.</div>"], ["", "FUENTES · DOCUMENTACIÓN OFICIAL", "Para profundizar y preparar el entorno", "<ul><li><a href=\"https://opentelemetry.io/docs/concepts/signals/\" target=\"_blank\" rel=\"noopener\">OpenTelemetry: señales</a></li><li><a href=\"https://opentelemetry.io/docs/concepts/context-propagation/\" target=\"_blank\" rel=\"noopener\">OpenTelemetry: propagación de contexto</a></li><li><a href=\"https://grafana.com/docs/opentelemetry/docker-lgtm/\" target=\"_blank\" rel=\"noopener\">Grafana: backend Docker OpenTelemetry LGTM</a></li><li><a href=\"https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/configure-trace-to-logs/\" target=\"_blank\" rel=\"noopener\">Grafana: correlación traza–logs</a></li><li><a href=\"https://prometheus.io/docs/guides/cadvisor/\" target=\"_blank\" rel=\"noopener\">Prometheus: métricas de contenedores con cAdvisor</a></li><li><a href=\"https://grafana.com/docs/grafana/latest/alerting/fundamentals/alert-rule-evaluation/\" target=\"_blank\" rel=\"noopener\">Grafana: evaluación de alertas</a></li><li><a href=\"https://prometheus.io/docs/alerting/latest/overview/\" target=\"_blank\" rel=\"noopener\">Prometheus y Alertmanager</a> · <a href=\"https://github.com/prometheus/blackbox_exporter\" target=\"_blank\" rel=\"noopener\">Blackbox Exporter</a> · <a href=\"https://grafana.com/docs/grafana/latest/alerting/fundamentals/notifications/\" target=\"_blank\" rel=\"noopener\">Notificaciones en Grafana</a></li><li><a href=\"https://kubernetes.io/docs/concepts/workloads/pods/probes/\" target=\"_blank\" rel=\"noopener\">Kubernetes: liveness, readiness y startup probes</a></li></ul><div class=\"call\">Fuentes base: 04/10/2026; sondas de salud: 05/10/2026. Ejemplos y umbrales de esta presentación son didácticos.</div>"]];
const speakerNotes=["<ul><li>La portada presenta las tres señales y la correlación que las conecta. Hoy analizamos un mismo pedido desde distintas perspectivas.</li><li>El resultado esperado es explicar un incidente con evidencia, no solamente mostrar un dashboard.</li><li>Usaremos el caso de pedidos y Grafana. Primero entendemos el problema; después aplicamos el laboratorio preparado.</li></ul>", "<ul><li>El diagrama muestra el flujo conocido y las tarjetas recuperan los contratos trabajados en documentación. Si hay evidencia de la clase anterior, abrirla brevemente.</li><li>Un contrato permite integrar equipos, pero no describe la ejecución de un pedido particular a las diez de la mañana.</li><li>La confirmación HTTP y el procesamiento asíncrono ocurren en momentos distintos: un 200 no demuestra que el worker terminó.</li></ul>", "<ul><li>El diagrama muestra una API en verde que respondió, un evento en RabbitMQ, un worker con demora y un resultado de negocio ausente. El color identifica el estado observado, no una causa demostrada.</li><li>El worker representa el consumidor del evento; cocina es el escenario de negocio que motiva la investigación. No damos por implementada una aplicación de cocina.</li><li>La pregunta para el grupo es: ¿qué evidencia pedirían antes de reiniciar servicios? Esperamos tiempos, errores, identificación del pedido y estado de recursos.</li></ul>", "<ul><li>Las tarjetas muestran tres motivos por los que buscar un mensaje aislado no alcanza: dispersión, concurrencia y separación temporal.</li><li>Una cola puede acumular trabajo aunque los procesos estén vivos. Un chequeo de salud solo demuestra lo que efectivamente comprueba.</li><li>Necesitamos señales que permitan relacionar operaciones y estudiar tendencias. Eso motiva la observabilidad.</li></ul>", "<ul><li>Las dos tarjetas comparan conceptos complementarios. Observabilidad tiene su origen conceptual en teoría de control y se aplica aquí a sistemas de software.</li><li>El monitoreo detecta situaciones previstas; la observabilidad ayuda a formular y responder nuevas preguntas usando telemetría suficiente.</li><li>Tener una herramienta instalada no garantiza observabilidad: debemos emitir datos útiles, relacionarlos e interpretarlos.</li></ul>", "<ul><li>La tabla suma 120 minutos: setenta de explicación y diálogo, cuarenta y cinco de práctico individual y cinco de cierre.</li><li>El práctico utiliza infraestructura e instrumentación preparadas: se concentra en comprobar, correlacionar y diagnosticar. El armado inicial y las imágenes se preparan antes.</li><li>El repaso operativo inicial del práctico aplica los quince minutos de Docker; no constituye un segundo bloque teórico. Los ejemplos de las diapositivas siguen siendo ilustrativos.</li></ul>", "<ul><li>A la izquierda hay una imagen; sus flechas producen dos contenedores a la derecha. Los contenedores se vinculan con un volumen: la ejecución y los datos tienen ciclos de vida diferentes. Cada servicio puede tener su propio volumen; el dibujo no obliga a compartirlo.</li><li>Publicar un puerto permite entrar desde el host. Entre contenedores de una red compartida usamos el nombre del servicio y su puerto interno.</li><li>docker stats ayuda a inspeccionar el presente, pero no sustituye un historial consultable de métricas.</li></ul>", "<ul><li>El fragmento visible declara dos servicios y una dirección basada en el nombre rabbitmq. Las imágenes son marcadores conceptuales, no versiones publicadas para ejecutar.</li><li>Compose crea por defecto una red del proyecto donde los servicios se resuelven por nombre. localhost dentro de api apunta a api, no al broker.</li><li>Un volumen se declara para datos persistentes y un healthcheck puede comprobar disponibilidad. depends_on por sí solo no garantiza que el servicio esté listo.</li></ul>", "<ul><li>El bloque muestra el ciclo básico de trabajo. api y worker son nombres propuestos para el entorno que prepararemos.</li><li>up -d inicia en segundo plano; ps muestra el estado; logs reúne las salidas; down retira contenedores y redes. down sin -v conserva los volúmenes nombrados.</li><li>Respuesta esperada: falta una relación explícita entre mensajes, servicios y operación, y falta historia de métricas. A continuación presentamos las señales.</li></ul>", "<ul><li>El gráfico presenta tres formatos: líneas de eventos, una curva temporal y barras de etapas. Los ejemplos son esquemáticos, sin valores medidos. Leer qué aporta cada formato antes de relacionarlos.</li><li>Los logs contienen detalle; las métricas permiten ver agregados; las trazas reconstruyen el recorrido de una operación instrumentada.</li><li>Un error puede aparecer en un log, aumentar un contador y marcar una etapa de una traza: son perspectivas relacionadas del mismo hecho.</li></ul>", "<ul><li>El JSON registra un error del worker, con tiempo, servicio, evento, pedido e identificadores de traza y etapa. Leer primero esos campos.</li><li>Un nivel error clasifica el registro, pero no establece automáticamente el estado de una traza ni envía una alerta. Esas acciones requieren configuración.</li><li>No registrar tokens ni datos personales innecesarios. Un log útil relata un hecho y aporta contexto estable para buscarlo.</li></ul>", "<ul><li>El flujo parte del código y termina en una búsqueda. OTLP es el protocolo de OpenTelemetry para transportar telemetría.</li><li>La aplicación necesita un logger y una integración que adjunte trace_id y span_id desde el contexto activo; escribir JSON sin esa integración no lo hace automáticamente.</li><li>Podemos exportar logs por OTLP o recolectar stdout con un agente. El laboratorio envía logs por OTLP a Loki; stdout permite consultarlos con Compose y no se ingiere nuevamente en Loki.</li></ul>", "<ul><li>A la izquierda vemos la llamada real a log del worker al procesar un pedido. El programador decide qué hechos registrar: éxito, falla, reintento o envío a DLQ. A la derecha vemos el registro abreviado que produce el logger; los identificadores del ejemplo no son valores para copiar.</li><li>En src/lib/observability.js, log agrega timestamp, nivel, service.name y evento. Obtiene trace_id y span_id del span activo y correlation_id del contexto de aplicación. Sin contexto activo, esos IDs de traza pueden faltar; el logger por sí solo no crea una traza.</li><li>El registro sigue dos rutas: JSON a stdout para consultarlo con docker compose logs, y un registro OpenTelemetry por OTLP al Collector y Loki. Grafana consulta Loki. No recolectamos stdout nuevamente hacia Loki, para evitar ingestión duplicada.</li><li>OpenTelemetry aporta contexto y transporte, pero no decide qué significa pedido procesado. Registrar solo texto sin identificadores dificultaría la correlación. Usamos niveles coherentes y evitamos tokens y datos personales innecesarios.</li></ul>", "<ul><li>Los gráficos distinguen contador, gauge e histograma: acumulación, valor actual y distribución. Gauge se pronuncia aproximadamente «gueich»: muestra cuánto hay ahora y puede subir o bajar, como una cola que pasa de doce mensajes pendientes a tres. Un contador puede reiniciarse con el proceso.</li><li>En cien intentos, noventa y cinco duran una décima de segundo y cinco duran tres segundos. La media es 0,245 segundos; con el criterio de rango más próximo, el percentil 95 es 0,1 segundos. Ni la media ni p95 describen por sí solos los cinco más lentos.</li><li>p95 es el valor dentro del cual termina aproximadamente el 95 % de los intentos. En Prometheus lo estimamos con buckets del histograma: puede diferir del percentil calculado sobre datos individuales.</li><li>Servicio y resultado permiten agrupar. Un pedido o trace_id diferente por etiqueta multiplicaría las series; los recursos se relacionan por servicio y tiempo.</li></ul>", "<ul><li>Las dos tarjetas separan aplicación y recursos: latencia y resultados de negocio frente a CPU y memoria del contenedor.</li><li>La API respondió 200: ¿demuestra que el worker terminó? No: la confirmación y el procesamiento asíncrono son etapas distintas. Buscamos el log de procesamiento y su estado persistido.</li><li>¿Una espera larga exige CPU alta? No: esperar una dependencia puede aumentar la duración con poca actividad de CPU. CPU alta es una pista que exige contraste, no una causa demostrada.</li></ul>", "<ul><li>El flujo presenta el productor, transporte, almacenamiento y consulta. Un exporter adapta datos al formato del sistema que los recoge.</li><li>Podemos exportar métricas de aplicación por OTLP al colector o exponer /metrics para que Prometheus las consulte. cAdvisor se recoge por scrape.</li><li>El intervalo de recolección determina resolución; una subida muy breve puede no quedar representada. En Docker Desktop y WSL verificaremos acceso a recursos y etiquetas antes del práctico.</li></ul>", "<ul><li>Las barras representan etapas, no registros de texto ni utilización de CPU. Su posición indica cuándo ocurre cada etapa y su longitud su duración aproximada.</li><li>Una traza reúne spans de una operación y conserva relaciones entre ellos. Un span puede terminar antes que un hijo asíncrono.</li><li>No sumamos ciegamente duraciones: puede haber solapamientos. La espera de la cola requiere medición o instrumentación explícita; no aparece como un span mágico.</li></ul>", "<ul><li>Las cuatro cajas muestran instrumentación, propagación e instrumentación del consumidor antes de exportar la traza. El contexto une etapas; el exporter solo transporta lo que se registró.</li><li>La instrumentación automática depende de bibliotecas compatibles y se inicializa antes de cargarlas. En este laboratorio usamos spans manuales para HTTP, publicación, consumo y dependencia simulada.</li><li>Si no instrumentamos una consulta MongoDB o la espera en cola, no veremos una barra propia para ellas. La ausencia de span no demuestra ausencia de actividad o demora.</li><li>El laboratorio conserva todas las trazas con poco tráfico. En producción el muestreo y la retención también condicionan qué podemos investigar.</li></ul>", "<ul><li>El gráfico compara dos filas. Arriba se pierde el contexto y aparecen trazas A y B; abajo se conserva el trace_id A y cada etapa mantiene un span_id propio. Las letras y números son abreviaturas didácticas.</li><li>El vínculo exacto logs-traza usa trace_id y, cuando corresponde, span_id. El vínculo con recursos usa identidad del servicio o contenedor y tiempo.</li><li>La correlación reduce el espacio de búsqueda, pero no prueba causalidad por sí sola. Necesitamos contrastar hipótesis y reproducir cuando sea posible.</li></ul>", "<ul><li>La tabla distingue identidad de negocio, correlación de aplicación, contexto de trazado e idempotencia. Mantener los nombres técnicos tal como se ven.</li><li>Podemos usar trace_id para correlación operativa, pero correlation_id puede tener otro alcance. Hay que declarar esa decisión y conservarla al cruzar servicios.</li><li>Una clave idempotente agrupa intentos de una operación según nuestro contrato; no determina el parent span ni constituye una traza.</li></ul>", "<ul><li>Las tres cajas siguen el pedido P-42 desde API y publicación, a los headers AMQP y al worker. A identifica la traza; H, P y W son spans diferentes. C identifica la correlación de aplicación. Son abreviaturas, no valores válidos para copiar.</li><li>El SDK inicia la traza y crea cada span. La API crea correlation_id; inyectamos traceparent y x-correlation-id en headers. El worker extrae el contexto y crea W como hijo de P, conservando A.</li><li>Al desactivar la propagación, el worker inicia otra traza B. Conservamos deliberadamente C: podemos buscar sus logs, pero no reconstruir una traza continua por copiar ese identificador.</li><li>traceparent transporta versión, trace_id, padre y flags; no transporta todos los logs. Este caso usa parent-child; lotes y otros patrones pueden requerir span links.</li></ul>", "<ul><li>Se ven tres pasos de investigación: seleccionar el span en Tempo, consultar su trace_id en Loki y comparar recursos del worker en ese intervalo. El tercer vínculo usa servicio y tiempo, no un trace_id como etiqueta de métricas.</li><li>El enlace construye una consulta usando el contexto del span. Necesitamos mapear el servicio y filtrar el identificador; también ajustar la ventana temporal.</li><li>trace_id se guarda como campo o metadato adecuado del log, no como etiqueta indexada de alta cardinalidad. El dashboard de recursos usa servicio/contenedor y tiempo, no un trace_id por serie.</li><li>Los relojes deben estar razonablemente sincronizados. Las métricas de contenedores son agregadas y no representan el consumo exclusivo de ese pedido.</li></ul>", "<ul><li>La tabla asigna una responsabilidad a cada componente. OpenTelemetry pertenece a CNCF y busca un estándar independiente del proveedor para instrumentar y transportar señales.</li><li>Prometheus surgió para monitoreo mediante series temporales; Grafana aporta visualización; Loki y Tempo completan logs y trazas del ecosistema Grafana.</li><li>Las consultas tienen lenguajes distintos porque los datos tienen modelos diferentes. No exigiremos dominar los tres lenguajes en esta introducción.</li></ul>", "<ul><li>La tabla ofrece alternativas sin afirmar que todas tienen el mismo costo de instalación o cubren las mismas señales.</li><li>Jaeger se centra en trazas; Kibana es una interfaz que necesita backend e ingestión; una plataforma administrada reduce operación local pero mantiene la necesidad de instrumentación.</li><li>Elegimos por el objetivo pedagógico y por la posibilidad de preparar un entorno reproducible. No por una comparación de rendimiento que no hemos medido.</li></ul>", "<ul><li>El borde grande delimita los servicios que levanta Compose: API, RabbitMQ, worker, MongoDB, cAdvisor y LGTM. Las flechas indican conexiones dentro de su red; usamos nombres de servicio.</li><li>LGTM es un solo servicio de Compose que agrupa Collector, Loki, Tempo, Prometheus y Grafana. OpenTelemetry en API y worker genera señales; el Collector las recibe; Grafana consulta los backends.</li><li>El comando construye imágenes y levanta los seis servicios. tools corre bajo demanda para generar tráfico, también en un contenedor. No necesitamos Node.js en el host.</li><li>Auth0 es externo y requiere un token real para el alumno. El navegador abre Grafana en localhost:3007 y la API está publicada en localhost:3008. LGTM es un empaquetado para desarrollo y clase.</li></ul>", "<ul><li>El gráfico muestra tres evidencias ilustrativas: un span largo del worker, su log de timeout y una curva de CPU sin aumento relevante. Los valores son ejemplos didácticos y el trazado de barras no está a escala.</li><li>La traza localiza la demora y el log agrega el fallo concreto. La CPU sin un pico relevante debilita una hipótesis de saturación local, pero no descarta todos los problemas de recursos.</li><li>Para confirmar necesitamos observar la dependencia, su timeout y otras operaciones. Un TimeoutError puede ser un síntoma y no la causa raíz.</li></ul>", "<ul><li>Los cinco pasos relacionan señales con decisiones de investigación. No hay obligación de empezar siempre por la misma pantalla: podemos llegar desde una alerta o un pedido reportado.</li><li>Comparar un antes y después ayuda a verificar una corrección. Conviene cambiar una variable por vez en la demostración.</li><li>¿Qué pasaría si esta investigación la hace un agente de IA? Necesita contexto y evidencia verificable; una correlación no autoriza por sí sola una acción automática.</li></ul>", "<ul><li>El diagrama compara detección tardía por reclamo con observación periódica. Las dos entradas de abajo, sonda externa y métricas internas, son complementarias; las flechas indican el recorrido conceptual, no que una sonda produzca métricas de negocio.</li><li>La métrica up de Prometheus refleja si el scrape tuvo éxito, no si el flujo de pedidos completó su trabajo. Un contenedor activo tampoco basta.</li><li>Un monitor define qué comprueba, cada cuánto y qué resultado espera. La sonda verifica el endpoint; las métricas instrumentadas verifican el flujo y su impacto. Un dashboard por sí solo no evalúa una condición ni notifica.</li></ul>", "<ul><li>El gráfico muestra sondas y exporters alimentando series en Prometheus y su visualización en Grafana. Las tarjetas separan observación externa e interna. Un exporter expone datos para recogerlos.</li><li>Blackbox Exporter comprueba conectividad o respuestas configuradas; un HTTP 200 de health no prueba un flujo de negocio completo. Una prueba sintética debe comprobar un resultado esperado y evitar efectos no controlados.</li><li>Para observar acumulación de mensajes necesitamos métricas del broker, no solo CPU. El laboratorio incluye cAdvisor y métricas de aplicación. Blackbox y las métricas del broker son opciones conceptuales; no se instalan en esta actividad.</li></ul>", "<ul><li>Las dos tarjetas distinguen decisiones: liveness pregunta si el proceso puede seguir funcionando; readiness si esta instancia puede atender ahora. Las flechas textuales muestran reinicio frente a retiro y retorno al tráfico.</li><li>Usamos liveness para bloqueos que requieren reiniciar. Evitamos usar una caída de MongoDB o RabbitMQ como motivo de reinicio de todas las réplicas: reiniciar la API no repara una dependencia externa. Umbrales y tiempos evitan reaccionar a un fallo aislado.</li><li>Usamos readiness durante inicialización o cuando una dependencia crítica impide atender el contrato. Si MongoDB cae, el proceso puede seguir vivo y la instancia dejar de estar lista. Elegimos las dependencias según las operaciones que debe servir; comprobar todas indiscriminadamente puede retirar toda la capacidad.</li><li>En Kubernetes, tras los umbrales configurados, liveness reinicia el contenedor y readiness lo retira de los endpoints de los Services; cuando se recupera vuelve a entrar. Startup probe protege arranques lentos antes de habilitar esas sondas. La API de nuestro Compose tiene un healthcheck: /health responde si el servidor HTTP atiende, no verifica la conectividad actual de DB o broker. depends_on con service_healthy ordena el arranque; unhealthy por sí solo no reinicia ni retira tráfico.</li></ul>", "<ul><li>Las tres cajas separan ventana, evaluación y persistencia. Debajo, la línea temporal muestra cuatro evaluaciones consecutivas con la condición cumplida. Son parámetros de la regla real del laboratorio.</li><li>Cada diez segundos calculamos el promedio por intento sobre los últimos dos minutos. Si supera un segundo, entra en Pending. Si la condición continúa durante treinta segundos, pasa a Firing; si deja de cumplirse antes, se reinicia la espera.</li><li>El ejemplo supone datos disponibles y evaluaciones puntuales. La ingestión y la frecuencia de evaluación condicionan el momento observado. Los dos minutos no son el tiempo que debemos esperar para disparar.</li><li>El laboratorio permite observar el estado. Firing no implica que alguien recibió un aviso: hacen falta política, contacto y responsable. El siguiente gráfico diferencia estados y falta de datos.</li></ul>", "<ul><li>Las tres cajas ordenan normal, pending y firing. La persistencia evita que un pico breve dispare la regla; la recuperación también depende de configuración. El aviso inferior distingue pérdida de datos y error de evaluación.</li><li>Una condición sostenida filtra picos breves. Las políticas de agrupación, silencios y puntos de contacto deciden cuándo y dónde llega una notificación.</li><li>Sin datos podemos haber perdido recolección; si se desconecta cAdvisor no interpretamos memoria cero. Debemos configurar explícitamente el tratamiento.</li></ul>", "<ul><li>Las tarjetas distinguen señales de impacto y contexto para investigar. Una alerta de recursos puede ser útil si anticipa un riesgo real y tiene una acción definida.</li><li>Más alertas no implica mejor observabilidad: el ruido hace que se ignoren. Establecemos severidad y evitamos duplicados.</li><li>Un runbook es una guía breve de respuesta: abrir dashboard, buscar trazas y logs, verificar dependencia y escalar al responsable.</li></ul>", "<ul><li>Las cajas muestran la ruta seleccionable en Grafana: datos, evaluación, política y contacto, y responsable. Debajo aparece la alternativa de Prometheus con Alertmanager.</li><li>Grafana Alerting permite reglas y notificaciones sobre fuentes compatibles. Un contacto es el destino, como correo o webhook; la política decide qué alertas van a ese destino y cómo agruparlas.</li><li>En la otra ruta Prometheus evalúa las reglas y Alertmanager gestiona sus notificaciones. No necesitamos ambas rutas duplicando la misma alerta. En la clase podemos mostrar el estado sin enviar comunicaciones externas.</li></ul>", "<ul><li>El gráfico muestra un caso de demanda alta: las métricas detectan impacto, la traza localiza el tramo, los logs aportan el error y los recursos permiten contrastar hipótesis. No se demuestra una causa por coincidir en el tiempo.</li><li>Una alerta abre la investigación; buscamos una traza afectada, consultamos sus logs y comparamos CPU, memoria y estado de cola en el intervalo. Si apunta a una dependencia, revisamos sus tiempos y errores.</li><li>Después de corregir verificamos reducción del p95, recuperación del procesamiento y menos errores. La observabilidad completa es especialmente valiosa si hay varios servicios, asincronía o fallos intermitentes; su cobertura depende de instrumentación y retención.</li><li>Los otros ejemplos usan el mismo método: comparar versiones tras un despliegue, observar llamadas externas y reconstruir intentos con identidad de negocio y contexto. No conserva automáticamente todas las trazas ni reemplaza una auditoría transaccional.</li></ul>", "<ul><li>La tabla conecta una etapa lenta, tres eventos del log, métricas y una regla. Es un ejemplo guiado basado en el escenario preparado, no una captura ni evidencia del equipo del alumno.</li><li>La dependencia simulada tarda tres segundos; el primer intento falla y se reintenta hasta procesar. Un HTTP 200 de la API no demuestra que el worker terminó. Para eso necesitamos evidencia posterior.</li><li>Una espera no implica CPU alta. Si el alumno observa CPU baja, eso es compatible con la espera; debe mostrar CPU y memoria del período antes de afirmar qué ocurrió en su equipo.</li><li>La evidencia individual contiene capturas propias, IDs, período, estado de la alerta y comparación con propagación desactivada. Distinguimos observación, hipótesis y comprobación; la actividad no cambia Entrega 1 del TPI.</li></ul>", "<ul><li>Las tres tarjetas recuperan las preguntas iniciales y el cierre relaciona señales con monitoreo y respuesta.</li><li>Preguntar: si eliminamos los headers de contexto del mensaje, ¿qué se rompe? Esperamos perder continuidad entre productor y consumidor y navegación confiable entre sus señales.</li><li>Preguntar: si vemos CPU alta y una traza lenta, ¿demostramos causalidad? No; necesitamos más evidencia y contraste.</li></ul>", "<ul><li>Los enlaces apuntan a documentación oficial de conceptos, herramientas y configuración. Consultarlos para preparar la implementación.</li><li>La documentación no demuestra que nuestro entorno funciona. El laboratorio fue validado en Docker Desktop ARM64 con una fixture RS256; la actividad del alumno usa Auth0 real.</li><li>Finalizamos con el objetivo observable: reconstruir una operación y explicar su problema relacionando las tres señales.</li></ul>"];

tDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});addEventListener('resize',resize);resize();show(Number(location.hash.replace('#D',''))-1||0);
