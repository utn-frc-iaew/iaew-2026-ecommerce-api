<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IAEW 2026 - Material de clase</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --ink: #10202f;
        --muted: #5d6b78;
        --blue: #005baa;
        --cyan: #00a6c8;
        --green: #35b779;
        --line: #d8e2ea;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        align-items: center;
        padding: 3rem 1.25rem;
      }

      .wrap {
        width: min(960px, 100%);
        margin: 0 auto;
      }

      .brand {
        width: min(320px, 68vw);
        height: auto;
        margin-bottom: 2.2rem;
      }

      .kicker {
        color: var(--blue);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.4rem 0 1rem;
        font-size: clamp(2.3rem, 5vw, 4.6rem);
        line-height: 1.04;
        letter-spacing: 0;
      }

      p {
        max-width: 760px;
        color: var(--muted);
        font-size: 1.15rem;
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 2rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        color: var(--ink);
        background: #fff;
        text-decoration: none;
        font-weight: 800;
      }

      a.primary {
        border-color: transparent;
        color: #fff;
        background: linear-gradient(90deg, var(--blue), var(--cyan), var(--green));
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <img class="brand" src="presentaciones/assets/logo-utn-frc-azul.png" alt="UTN Facultad Regional Cordoba" />
        <div class="kicker">IAEW 2026 · Clase 02</div>
        <h1>E-commerce integrado con API REST + MongoDB</h1>
        <p>
          Material de apoyo para la clase: presentación navegable y guía de actividad práctica
          para desarrollar una API Express desde cero, conectar MongoDB y validar persistencia.
        </p>
        <div class="actions">
          <a class="primary" href="presentaciones/clase-02/">Abrir presentacion</a>
          <a href="clases/clase-02/">Abrir actividad practica</a>
          <a href="https://github.com/utn-frc-iaew/iaew-2026-ecommerce-api">Ver repositorio</a>
        </div>
      </div>
    </main>
  </body>
</html>
